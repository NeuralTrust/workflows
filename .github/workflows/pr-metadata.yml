# ==============================================================================
# Reusable Workflow: PR Metadata Validation
# ==============================================================================
# Validates pull request metadata:
#   - Title must start with an accepted conventional prefix.
#   - Description must be at least 20 characters long after trimming whitespace.
#   - PR must reference a Linear issue key or issue URL.
#
# Release PRs that promote `develop` -> `main` aggregate many already-reviewed
# changes and have no single Linear issue, so the Linear-reference requirement is
# skipped for them (title and description checks still apply).
#
# Pull requests opened by Dependabot are exempt from the same requirement: they
# are generated from the dependency graph, so there is no issue to reference and
# nothing a human can add to the branch name. Their titles and descriptions are
# still validated.
#
# Usage:
#   jobs:
#     pr-metadata:
#       uses: NeuralTrust/workflows/.github/workflows/pr-metadata.yml@main
# ==============================================================================

name: PR Metadata Validation

on:
  workflow_call:

# No workflow-level `concurrency:` here — a reusable workflow cannot key a group
# per calling job (github.run_id/workflow/ref are identical across sibling and
# matrix jobs), so siblings would cancel each other. Callers declare their own.

jobs:
  validate-pr-metadata:
    name: Validate PR Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Validate PR title, description, and Linear issue
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python3 - <<'PYEOF'
          import os
          import re
          import sys

          accepted_prefixes = (
              "fix:",
              "feat:",
              "build:",
              "chore:",
              "ci:",
              "docs:",
              "style:",
              "refactor:",
              "perf:",
              "test:",
          )

          title = os.environ.get("PR_TITLE", "")
          body = os.environ.get("PR_BODY", "")
          branch = os.environ.get("PR_BRANCH", "")
          base = os.environ.get("PR_BASE", "")
          author = os.environ.get("PR_AUTHOR", "")
          trimmed_body = body.strip()

          # Release PRs promoting develop -> main roll up many already-reviewed
          # PRs and have no single Linear issue to reference.
          is_release_pr = branch == "develop" and base == "main"

          # Dependabot PRs are generated from the dependency graph: no issue
          # exists to reference, and the branch name is not author-controlled.
          is_dependabot_pr = author == "dependabot[bot]"

          errors = []

          # Conventional Commits allows an optional scope and a `!` breaking-change
          # marker after the type, e.g. `chore(deps):` or `feat!:`. Dependabot's
          # configured prefixes are scoped, so a type-only pattern rejects every
          # dependency PR it opens.
          if not re.match(
              r"^(fix|feat|build|chore|ci|docs|style|refactor|perf|test)(\([^()]+\))?!?:",
              title,
          ):
              errors.append(
                  "PR title must start with one of: "
                  + ", ".join(accepted_prefixes)
                  + f" Current title: {title!r}"
              )

          if len(trimmed_body) < 20:
              errors.append(
                  "PR description must be at least 20 characters long after trimming whitespace. "
                  f"Current length: {len(trimmed_body)}."
              )

          linear_issue_pattern = re.compile(
              r"(https?://linear\.app/[^\s]+/issue/[a-z][a-z0-9]+-\d+|(?<![a-z0-9])[a-z][a-z0-9]+-\d+(?![a-z0-9]))",
              re.IGNORECASE,
          )
          searchable_metadata = "\n".join([title, body, branch])
          requires_linear_issue = not is_release_pr and not is_dependabot_pr
          if requires_linear_issue and not linear_issue_pattern.search(searchable_metadata):
              errors.append(
                  "PR must reference a Linear issue in the title, description, or branch name. "
                  "Use an issue key like ENG-123 or a Linear issue URL."
              )

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)

          print("PR title, description, and Linear issue reference are valid.")
          PYEOF
