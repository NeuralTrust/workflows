# ==============================================================================
# Reusable Workflow: AI Review
# ==============================================================================
# Two checks on pull requests that bring new code:
#
#   - confidentiality: one Claude call (Haiku 5.5 by default) over the full PR
#                      diff, commit messages, title and body, with no tools.
#                      Returns {verdict, findings[]}. Meant to be a REQUIRED
#                      check. Fails closed: any error, missing secret, fork PR
#                      or unexpected event is red. `mode: warn` only turns
#                      findings into warnings; errors stay red.
#   - quality:         Claude Sonnet 5.5 through claude-code-action with
#                      read-only tools (Read, Grep, Glob) reviews what changed
#                      since its last review (job quality-review), and
#                      quality-publish posts inline comments and one sticky
#                      summary. Blocker findings stay open in that summary until
#                      a later review confirms them fixed. The `quality` job is
#                      the gate: it always runs, and in `mode: enforce` it is
#                      red while blockers are open or the review did not
#                      complete, and the review requests changes.
#
# The rules, prompts and scripts live in the private NeuralTrust/agents-hub
# repository (plugin `review`), fetched at a pinned tag `review-vX.Y.Z`. This
# public repository holds no rule or prompt text; the jobs never print it.
#
# When the review runs (job `decide`):
#   - PRs into develop from feature branches and hotfix/* into main: yes.
#   - Promotes develop → main, back-merges main → develop (head `main`, or a
#     branch whose only commits outside develop are main's commits plus clean,
#     conflict-free merge commits) and Dependabot PRs: skipped, green. A
#     back-merge with conflict resolutions gets a full review.
#   - Fork PRs, pull_request_target, invalid inputs: red. A maintainer pushes a
#     fork's branch to the repository to get it reviewed.
#
# Override: the label `ai-review/override` makes both gates pass, but only
# when the last time it was applied it was applied by edukmx.
#
# Usage (separate workflow file, so labels and body edits re-run the gate
# without re-running the test suite):
#
#   on:
#     pull_request:
#       branches: [main, develop]
#       types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
#   concurrency:
#     group: ai-review-${{ github.event.pull_request.number }}-${{ contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) && 'meta' || 'code' }}
#     cancel-in-progress: true
#   permissions:
#     contents: read
#     pull-requests: write
#     issues: write
#   jobs:
#     ai-review:
#       uses: NeuralTrust/workflows/.github/workflows/ai-review.yml@main
#       with:
#         plugin_ref: review-v0.1.2
#         plugin_sha: <commit the tag points to>
#         mode: warn
#       secrets:
#         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#         AGENTS_HUB_APP_ID: ${{ secrets.AGENTS_HUB_APP_ID }}
#         AGENTS_HUB_APP_PRIVATE_KEY: ${{ secrets.AGENTS_HUB_APP_PRIVATE_KEY }}
#
# Status checks (for rulesets): `ai-review / confidentiality` and
# `ai-review / quality` (required); `ai-review / quality-review` and
# `ai-review / quality-publish` are informational. `ai-review` is the caller's
# job id.
# ==============================================================================

name: AI Review

on:
  workflow_call:
    inputs:
      plugin_ref:
        description: "Tag of the review plugin in NeuralTrust/agents-hub (review-vX.Y.Z)"
        type: string
        required: true
      plugin_sha:
        description: "Commit that plugin_ref must point to. Tags can be moved; when set, a mismatch fails the run"
        type: string
        default: ""
      mode:
        description: "enforce: findings fail the check. warn: findings are warnings (pilot)"
        type: string
        default: enforce
      quality_enabled:
        description: "Run the advisory quality review"
        type: boolean
        default: true
      repo_skill:
        description: "Repository skill under skills/repos/ (default: lowercased repository name)"
        type: string
        default: ""
      confidentiality_model:
        description: "Model for the confidentiality pass"
        type: string
        default: claude-haiku-5-5
      quality_model:
        description: "Model for the quality pass"
        type: string
        default: claude-sonnet-5-5
    secrets:
      ANTHROPIC_API_KEY:
        description: "Anthropic API key (org workspace for CI review)"
        required: false
      AGENTS_HUB_APP_ID:
        description: "GitHub App id with contents:read on NeuralTrust/agents-hub"
        required: false
      AGENTS_HUB_APP_PRIVATE_KEY:
        description: "Private key of that GitHub App"
        required: false
      AGENTS_HUB_TOKEN:
        description: "Alternative to the App: a read-only token for NeuralTrust/agents-hub"
        required: false

# No workflow-level `concurrency:` here — a reusable workflow cannot key a group
# per calling job, so siblings would cancel each other. Callers declare their own.

jobs:
  decide:
    name: decide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      unexpected: ${{ steps.decide.outputs.unexpected }}
      reason: ${{ steps.decide.outputs.reason }}
      quality: ${{ steps.decide.outputs.quality }}
      override: ${{ steps.override.outputs.active }}
    steps:
      # History is only needed to recognise a back-merge sent from a side branch.
      - name: Checkout (back-merge detection)
        if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.head_ref != 'main'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether to review
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          MODE: ${{ inputs.mode }}
          PLUGIN_REF: ${{ inputs.plugin_ref }}
          PLUGIN_SHA: ${{ inputs.plugin_sha }}
          QUALITY_ENABLED: ${{ inputs.quality_enabled }}
        run: |
          python3 - <<'PYEOF'
          import os
          import re
          import subprocess

          env = os.environ.get


          def git(*args: str) -> str:
              return subprocess.run(["git", *args], check=True, capture_output=True,
                                    text=True).stdout.strip()


          def clean_merge(commit: str) -> bool:
              """True when a merge commit's tree is exactly the conflict-free merge of its parents."""
              parents = git("rev-list", "--parents", "-n", "1", commit).split()[1:]
              if len(parents) != 2:
                  return False
              merged = subprocess.run(["git", "merge-tree", "--write-tree", *parents],
                                      capture_output=True, text=True)
              if merged.returncode != 0:
                  return False
              return merged.stdout.split()[0] == git("rev-parse", commit + "^{tree}")


          def only_main_commits() -> bool:
              """True for a back-merge sent from a side branch.

              Every commit outside develop must be on main, or be a merge commit whose
              tree is the clean merge of its parents. Anything added on top, or while
              resolving conflicts, makes the PR reviewable.
              """
              try:
                  git("rev-parse", "--verify", "-q", "origin/main")
                  range_args = [env("HEAD_SHA"), "^" + env("BASE_SHA"), "^origin/main"]
                  if git("rev-list", "--no-merges", *range_args):
                      return False
                  merges = git("rev-list", "--merges", *range_args).split()
                  return bool(merges) and all(clean_merge(m) for m in merges)
              except (subprocess.CalledProcessError, FileNotFoundError, IndexError):
                  return False


          def decide() -> tuple[bool, bool, str]:
              """Return (run, unexpected, reason)."""
              if env("MODE") not in ("warn", "enforce"):
                  return False, True, f"invalid mode {env('MODE')!r}; use warn or enforce"
              if not re.fullmatch(r"review-v\d+\.\d+\.\d+", env("PLUGIN_REF", "")):
                  return False, True, "plugin_ref must be a review-vX.Y.Z tag"
              if env("PLUGIN_SHA") and not re.fullmatch(r"[0-9a-f]{40}", env("PLUGIN_SHA")):
                  return False, True, "plugin_sha must be a full 40-character commit SHA"
              if env("EVENT_NAME") == "pull_request_target":
                  return False, True, "pull_request_target is not supported; use pull_request"
              if env("EVENT_NAME") != "pull_request":
                  return False, False, f"event {env('EVENT_NAME')} is not a pull request"
              if env("HEAD_REPO") != env("REPOSITORY"):
                  return False, True, ("pull request from a fork is not reviewed; a maintainer "
                                       "must push the branch to this repository")
              if env("PR_AUTHOR") == "dependabot[bot]":
                  return False, False, "Dependabot PR: dependency bumps are covered by tests and scans"
              base, head = env("BASE_REF"), env("HEAD_REF")
              if base == "main" and head == "develop":
                  return False, False, "promote develop -> main: its changes were reviewed in develop"
              if base == "develop" and head == "main":
                  return False, False, "back-merge main -> develop: its changes were reviewed in main"
              if base == "develop" and only_main_commits():
                  return False, False, "back-merge from a side branch: only main's commits and merges"
              return True, False, f"{head} -> {base}: new code"


          run, unexpected, reason = decide()
          quality = (
              run
              and env("QUALITY_ENABLED") == "true"
              and env("EVENT_ACTION") in ("opened", "synchronize", "reopened", "ready_for_review")
              and env("PR_DRAFT") != "true"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"run={str(run).lower()}\n")
              out.write(f"unexpected={str(unexpected).lower()}\n")
              out.write(f"quality={str(quality).lower()}\n")
              out.write(f"reason={reason}\n")
          print(f"run={run} unexpected={unexpected} quality={quality}: {reason}")
          PYEOF

      # The actor of the event that triggered the run is whoever pushed; the
      # override counts only if edukmx applied the label last.
      - name: Check override label
        id: override
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          last=$(gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/events" \
            --jq '.[] | select((.event == "labeled" or .event == "unlabeled") and .label.name == "ai-review/override") | "\(.event) \(.actor.login)"' \
            | tail -n 1)
          if [ "$last" = "labeled edukmx" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            [ -n "$last" ] && echo "::notice::ai-review/override present but not applied by edukmx; ignored"
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

  confidentiality:
    name: confidentiality
    needs: decide
    # always(): a failed or cancelled `decide` must turn this check red, not skip it.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Gate
        id: gate
        env:
          DECIDE_RESULT: ${{ needs.decide.result }}
          RUN: ${{ needs.decide.outputs.run }}
          UNEXPECTED: ${{ needs.decide.outputs.unexpected }}
          REASON: ${{ needs.decide.outputs.reason }}
        run: |
          if [ "$DECIDE_RESULT" != "success" ]; then
            echo "::error::decide job ended with '$DECIDE_RESULT'; no review ran. Failing closed."
            exit 1
          fi
          if [ "$UNEXPECTED" = "true" ]; then
            echo "::error::No review ran: $REASON"
            exit 1
          fi
          if [ "$RUN" != "true" ]; then
            echo "::notice::Review skipped by design: $REASON"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Check override label
        id: override
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The actor of the event that triggered the run is whoever pushed; the
          # override counts only if edukmx applied the label last.
          last=$(gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/events" \
            --jq '.[] | select((.event == "labeled" or .event == "unlabeled") and .label.name == "ai-review/override") | "\(.event) \(.actor.login)"' \
            | tail -n 1)
          if [ "$last" = "labeled edukmx" ]; then
            echo "::warning::ai-review/override applied by edukmx: confidentiality review bypassed"
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$last" ]; then
              echo "::notice::ai-review/override present but not applied by edukmx; ignored"
            fi
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check secrets
        id: secrets
        if: steps.gate.outputs.proceed == 'true' && steps.override.outputs.active != 'true'
        env:
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_APP: ${{ secrets.AGENTS_HUB_APP_ID != '' && secrets.AGENTS_HUB_APP_PRIVATE_KEY != '' }}
          HAS_TOKEN: ${{ secrets.AGENTS_HUB_TOKEN != '' }}
        run: |
          if [ "$HAS_API_KEY" != "true" ]; then
            echo "::error::ANTHROPIC_API_KEY is not available to this workflow. Failing closed."
            exit 1
          fi
          if [ "$HAS_APP" != "true" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::No credentials to read NeuralTrust/agents-hub (AGENTS_HUB_APP_* or AGENTS_HUB_TOKEN). Failing closed."
            exit 1
          fi
          echo "use_app=$HAS_APP" >> "$GITHUB_OUTPUT"

      - name: Create agents-hub token
        id: app-token
        if: steps.secrets.outputs.use_app == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AGENTS_HUB_APP_ID }}
          private-key: ${{ secrets.AGENTS_HUB_APP_PRIVATE_KEY }}
          owner: NeuralTrust
          repositories: agents-hub
          permission-contents: read

      - name: Fetch review plugin
        if: steps.secrets.outcome == 'success'
        env:
          HUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.AGENTS_HUB_TOKEN }}
          PLUGIN_REF: ${{ inputs.plugin_ref }}
          PLUGIN_SHA: ${{ inputs.plugin_sha }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/agents-hub"
          auth=$(printf 'x-access-token:%s' "$HUB_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            clone --quiet --depth 1 --branch "$PLUGIN_REF" \
            https://github.com/NeuralTrust/agents-hub.git "$dest"
          if ! git -C "$dest" tag --points-at HEAD | grep -qx "$PLUGIN_REF"; then
            echo "::error::$PLUGIN_REF is not a tag of NeuralTrust/agents-hub"
            exit 1
          fi
          actual=$(git -C "$dest" rev-parse HEAD)
          if [ -n "$PLUGIN_SHA" ] && [ "$actual" != "$PLUGIN_SHA" ]; then
            echo "::error::$PLUGIN_REF points to $actual, not the pinned plugin_sha $PLUGIN_SHA. The tag was moved; failing closed."
            exit 1
          fi
          echo "review plugin at $PLUGIN_REF ($(git -C "$dest" rev-parse --short HEAD))"

      - name: Checkout pull request
        if: steps.secrets.outcome == 'success'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Collect diff, commits, title and body
        if: steps.secrets.outcome == 'success'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ai-review"
          mkdir -p "$out"
          # Always the full PR (merge base to head): an incremental view would
          # let a leak from an earlier push pass once a later push lands.
          git -C pr diff --no-color --no-ext-diff "${BASE_SHA}...${HEAD_SHA}" > "$out/diff.patch"
          git -C pr log --format='commit %H%n%B' "${BASE_SHA}..${HEAD_SHA}" > "$out/commits.txt"
          printf '%s' "$PR_TITLE" > "$out/title.txt"
          printf '%s' "$PR_BODY" > "$out/body.txt"
          echo "diff: $(wc -l < "$out/diff.patch") lines, commits: $(grep -c '^commit ' "$out/commits.txt" || true)"

      - name: Install uv
        if: steps.secrets.outcome == 'success'
        uses: astral-sh/setup-uv@v7

      - name: Confidentiality review
        if: steps.secrets.outcome == 'success'
        timeout-minutes: 2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_REVIEW_MODEL: ${{ inputs.confidentiality_model }}
          MODE: ${{ inputs.mode }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set +e
          out="$RUNNER_TEMP/ai-review"
          level=error
          [ "$MODE" = "warn" ] && level=warning
          private=()
          [ "$REPO_PRIVATE" = "true" ] && private=(--private)
          uv run --quiet --no-project --python 3.12 --with anthropic==2.10.0 \
            "$RUNNER_TEMP/agents-hub/plugins/review/scripts/confidentiality.py" \
            --diff "$out/diff.patch" --commits "$out/commits.txt" \
            --title "$out/title.txt" --body "$out/body.txt" \
            --level "$level" "${private[@]}"
          code=$?
          # 0 = clean, 10 = findings; anything else (including a crash or a
          # failed install) means no review ran.
          case "$code" in
            0) exit 0 ;;
            10)
              if [ "$MODE" = "warn" ]; then
                echo "::warning::Confidentiality findings (mode: warn, not blocking)."
                exit 0
              fi
              echo "::error::Confidentiality findings block this PR. Fix them, or ask edukmx for the ai-review/override label with the reason in the PR."
              exit 1
              ;;
            *)
              echo "::error::Confidentiality review did not complete (exit $code). Failing closed."
              exit 1
              ;;
          esac

  quality-review:
    name: quality-review
    needs: decide
    if: needs.decide.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      skip: ${{ steps.range.outputs.skip }}
      structured: ${{ steps.claude.outputs.structured_output }}
      range: ${{ steps.range.outputs.range }}
      previous: ${{ steps.range.outputs.previous }}
    steps:
      - name: Check secrets
        id: secrets
        env:
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_APP: ${{ secrets.AGENTS_HUB_APP_ID != '' && secrets.AGENTS_HUB_APP_PRIVATE_KEY != '' }}
          HAS_TOKEN: ${{ secrets.AGENTS_HUB_TOKEN != '' }}
        run: |
          if [ "$HAS_API_KEY" != "true" ] || { [ "$HAS_APP" != "true" ] && [ "$HAS_TOKEN" != "true" ]; }; then
            echo "::warning::Quality review skipped: missing ANTHROPIC_API_KEY or agents-hub credentials."
            exit 1
          fi
          echo "use_app=$HAS_APP" >> "$GITHUB_OUTPUT"

      - name: Create agents-hub token
        id: app-token
        if: steps.secrets.outputs.use_app == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AGENTS_HUB_APP_ID }}
          private-key: ${{ secrets.AGENTS_HUB_APP_PRIVATE_KEY }}
          owner: NeuralTrust
          repositories: agents-hub
          permission-contents: read

      - name: Fetch review plugin
        env:
          HUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.AGENTS_HUB_TOKEN }}
          PLUGIN_REF: ${{ inputs.plugin_ref }}
          PLUGIN_SHA: ${{ inputs.plugin_sha }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/agents-hub"
          auth=$(printf 'x-access-token:%s' "$HUB_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            clone --quiet --depth 1 --branch "$PLUGIN_REF" \
            https://github.com/NeuralTrust/agents-hub.git "$dest"
          git -C "$dest" tag --points-at HEAD | grep -qx "$PLUGIN_REF"
          actual=$(git -C "$dest" rev-parse HEAD)
          if [ -n "$PLUGIN_SHA" ] && [ "$actual" != "$PLUGIN_SHA" ]; then
            echo "::error::$PLUGIN_REF points to $actual, not the pinned plugin_sha $PLUGIN_SHA. The tag was moved; failing closed."
            exit 1
          fi

      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select range since last review
        id: range
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ai-review"
          mkdir -p "$out"
          previous=$(python3 "$RUNNER_TEMP/agents-hub/plugins/review/scripts/publish_quality.py" last-sha)
          if [ "$previous" = "$HEAD_SHA" ]; then
            echo "::notice::Head already reviewed; nothing new."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$previous" ] && git merge-base --is-ancestor "$previous" "$HEAD_SHA" 2>/dev/null; then
            range="${previous}..${HEAD_SHA}"
          else
            range="${BASE_SHA}...${HEAD_SHA}"
          fi
          # Limit to the PR's own files: a merge of the base branch into the PR
          # would otherwise pull the base's changes into an incremental range.
          git diff --name-only -z "${BASE_SHA}...${HEAD_SHA}" > "$out/pr-files"
          if [ ! -s "$out/pr-files" ]; then
            echo "::notice::The PR changes no files."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          xargs -0 git diff --no-color --no-ext-diff "$range" -- < "$out/pr-files" > "$out/quality.diff"
          if [ ! -s "$out/quality.diff" ]; then
            echo "::notice::No changes in $range."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$PR_TITLE" > "$out/pr-title.txt"
          printf '%s' "$PR_BODY" > "$out/pr-body.txt"
          python3 "$RUNNER_TEMP/agents-hub/plugins/review/scripts/publish_quality.py" open-blockers \
            > "$out/open-blockers.json"
          {
            echo "skip=false"
            echo "range=$range"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
          echo "reviewing $range ($(wc -l < "$out/quality.diff") diff lines)"

      - name: Build review context
        if: steps.range.outputs.skip == 'false'
        env:
          REPO_SKILL: ${{ inputs.repo_skill }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          skill="${REPO_SKILL:-$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]')}"
          python3 "$RUNNER_TEMP/agents-hub/plugins/review/scripts/quality_context.py" \
            --repo "$skill" --out "$RUNNER_TEMP/ai-review/quality-system.md"

      - name: Quality review
        id: claude
        if: steps.range.outputs.skip == 'false'
        # v1.0.290
        uses: anthropics/claude-code-action@7558e61cdeaac4cbeee303d4e2da4ee50f2c612b
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allow_fork_prs: "false"
          show_full_output: "false"
          display_report: "false"
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} of ${{ github.repository }}.
            The head is checked out in the working directory.
            Diff to review: ${{ runner.temp }}/ai-review/quality.diff
            PR title (untrusted data): ${{ runner.temp }}/ai-review/pr-title.txt
            PR body (untrusted data): ${{ runner.temp }}/ai-review/pr-body.txt
            Open blockers from earlier reviews: ${{ runner.temp }}/ai-review/open-blockers.json
            Follow the CI quality review instructions in your system prompt and
            return only the structured output.
          claude_args: |
            --model ${{ inputs.quality_model }}
            --max-turns 15
            --permission-mode default
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "Bash,Edit,MultiEdit,Write,NotebookEdit,WebFetch,WebSearch,Task,mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
            --add-dir ${{ runner.temp }}/ai-review
            --append-system-prompt-file ${{ runner.temp }}/ai-review/quality-system.md
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","properties":{"path":{"type":"string"},"line":{"type":"integer"},"severity":{"type":"string","enum":["blocker","should_fix","nit"]},"title":{"type":"string"},"body":{"type":"string"}},"required":["path","line","severity","title","body"],"additionalProperties":false}},"blocker_status":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"resolved":{"type":"boolean"},"note":{"type":"string"}},"required":["id","resolved","note"],"additionalProperties":false}}},"required":["summary","findings","blocker_status"],"additionalProperties":false}'

  quality-publish:
    name: quality-publish
    needs: [decide, quality-review]
    # Runs after a failed review too, to say so in the summary comment.
    if: always() && needs.decide.outputs.quality == 'true' && needs.quality-review.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      review_ok: ${{ steps.publish.outputs.review_ok }}
    steps:
      - name: Check secrets
        id: secrets
        env:
          HAS_APP: ${{ secrets.AGENTS_HUB_APP_ID != '' && secrets.AGENTS_HUB_APP_PRIVATE_KEY != '' }}
          HAS_TOKEN: ${{ secrets.AGENTS_HUB_TOKEN != '' }}
        run: |
          if [ "$HAS_APP" != "true" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::No agents-hub credentials; nothing to publish."
            exit 1
          fi
          echo "use_app=$HAS_APP" >> "$GITHUB_OUTPUT"

      - name: Create agents-hub token
        id: app-token
        if: steps.secrets.outputs.use_app == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AGENTS_HUB_APP_ID }}
          private-key: ${{ secrets.AGENTS_HUB_APP_PRIVATE_KEY }}
          owner: NeuralTrust
          repositories: agents-hub
          permission-contents: read

      - name: Fetch review plugin
        env:
          HUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.AGENTS_HUB_TOKEN }}
          PLUGIN_REF: ${{ inputs.plugin_ref }}
          PLUGIN_SHA: ${{ inputs.plugin_sha }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/agents-hub"
          auth=$(printf 'x-access-token:%s' "$HUB_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            clone --quiet --depth 1 --branch "$PLUGIN_REF" \
            https://github.com/NeuralTrust/agents-hub.git "$dest"
          git -C "$dest" tag --points-at HEAD | grep -qx "$PLUGIN_REF"
          actual=$(git -C "$dest" rev-parse HEAD)
          if [ -n "$PLUGIN_SHA" ] && [ "$actual" != "$PLUGIN_SHA" ]; then
            echo "::error::$PLUGIN_REF points to $actual, not the pinned plugin_sha $PLUGIN_SHA. The tag was moved; failing closed."
            exit 1
          fi

      - name: Publish quality review
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_RANGE: ${{ needs.quality-review.outputs.range }}
          PREVIOUS_SHA: ${{ needs.quality-review.outputs.previous }}
          STRUCTURED_OUTPUT: ${{ needs.quality-review.outputs.structured }}
          MODE: ${{ inputs.mode }}
          OVERRIDE: ${{ needs.decide.outputs.override }}
        run: python3 "$RUNNER_TEMP/agents-hub/plugins/review/scripts/publish_quality.py" publish

  # The required check. It always runs, so an event that skips the review (a
  # label, a body edit, a draft) still reports the open blockers instead of a
  # skipped job, which GitHub would count as passing.
  quality:
    name: quality
    needs: [decide, quality-review, quality-publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: Quality gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MODE: ${{ inputs.mode }}
          DECIDE_RESULT: ${{ needs.decide.result }}
          RUN: ${{ needs.decide.outputs.run }}
          UNEXPECTED: ${{ needs.decide.outputs.unexpected }}
          REASON: ${{ needs.decide.outputs.reason }}
          REVIEWED: ${{ needs.decide.outputs.quality }}
          OVERRIDE: ${{ needs.decide.outputs.override }}
          REVIEW_SKIPPED: ${{ needs.quality-review.outputs.skip }}
          REVIEW_OK: ${{ needs.quality-publish.outputs.review_ok }}
        run: |
          set -euo pipefail
          fail() {
            if [ "$MODE" = "enforce" ]; then echo "::error::$1"; exit 1; fi
            echo "::warning::$1 (mode: warn, not blocking)"
            exit 0
          }
          # The bot's change request would keep blocking the merge after the
          # gate turns green, and label events never reach the publish job.
          dismiss_change_requests() {
            gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "CHANGES_REQUESTED") | .id' \
              | while read -r review; do
                  gh api -X PUT "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews/${review}/dismissals" \
                    -f message="$1" -f event=DISMISS > /dev/null \
                    || echo "::warning::could not dismiss review ${review}"
                done
          }
          if [ "$DECIDE_RESULT" != "success" ]; then
            echo "::error::decide job ended with '$DECIDE_RESULT'; no review ran. Failing closed."
            exit 1
          fi
          if [ "$UNEXPECTED" = "true" ]; then
            echo "::error::No review ran: $REASON"
            exit 1
          fi
          if [ "$RUN" != "true" ]; then
            echo "::notice::Review skipped by design: $REASON"
            exit 0
          fi
          if [ "$OVERRIDE" = "true" ]; then
            echo "::warning::ai-review/override applied by edukmx: quality gate bypassed"
            dismiss_change_requests "Blockers bypassed by the ai-review/override label."
            exit 0
          fi
          if [ "$REVIEWED" = "true" ] && [ "$REVIEW_SKIPPED" != "true" ] && [ "$REVIEW_OK" != "true" ]; then
            fail "The quality review did not complete for this push; push again or re-run the workflow."
          fi
          count=$(gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- ai-review:quality -->"))) | .body' \
            | python3 -c '
          import base64, json, re, sys
          bodies = sys.stdin.read()
          found = re.findall(r"<!-- ai-review:quality open-blockers=([A-Za-z0-9+/=]*) -->", bodies)
          try:
              print(len(json.loads(base64.b64decode(found[-1])))) if found else print(0)
          except ValueError:
              print(0)
          ')
          if [ "$count" -gt 0 ]; then
            fail "$count open blocker(s) from the AI quality review. See the ai-review / quality summary comment; fix them or ask edukmx for the ai-review/override label."
          fi
          dismiss_change_requests "No open blockers left in the AI quality review."
          echo "No open blockers."
