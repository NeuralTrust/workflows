# ==============================================================================
# Reusable Workflow: AI-Powered Semantic Version Bump
# ==============================================================================
# Analyzes commits since the last release using OpenAI and determines the
# appropriate semver bump (major, minor, patch) per https://semver.org/
#
# Creates a GitHub Release with the new version tag. The release event then
# triggers the repo's release.yml workflow for building and deploying.
#
# Job graph:
#   bump ──► resolve-image ──► scan ──► publish
#            (opt-in)          (opt-in)  tag + Release + version files
#                                         └──► notify-failure (Slack + reason)
#
# `bump` only COMPUTES the next version. Nothing is tagged, committed or
# published until the optional image-scan gate has passed, so a vulnerable
# promote source can never produce a release (no orphan tag, no half-done
# release). The gate scans, by digest, the dev image release-promote.yml will
# promote; when the release will rebuild there is no image yet, the scan is
# skipped, and release-promote.yml gates the rebuilt image instead.
# When `image_scan_enabled: false` (default) resolve-image/scan are skipped and
# behaviour is identical to the pre-gate version of this workflow.
#
# Usage (no image scan — unchanged behaviour):
#   jobs:
#     release:
#       uses: NeuralTrust/workflows/.github/workflows/ai-release-bump.yml@main
#       secrets:
#         OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
#         GH_TOKEN: ${{ secrets.GH_TOKEN }}
#         SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
#
# Usage (blocking image-scan gate before the release is created):
#   jobs:
#     release:
#       uses: NeuralTrust/workflows/.github/workflows/ai-release-bump.yml@main
#       permissions:
#         contents: write
#         id-token: write          # GCP WIF auth to resolve/pull the dev image
#       with:
#         image_scan_enabled: true
#         image_name: my-service
#         dev_gcp_project_id: dev-project-id
#       secrets:
#         OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
#         GH_TOKEN: ${{ secrets.GH_TOKEN }}
#         WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
#         WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
#         SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
#
# Note: GH_TOKEN must be a PAT (not GITHUB_TOKEN) so the created release
#       event can trigger other workflows (release.yml).
#
# Loop guard: pushes whose head commit message starts with `chore: bump version`
# or `docs(changelog):` exit early (see bump-guard). The first covers the
# automated semver bump this workflow itself produces; the second covers
# pushes made by `openspec-changelog.yml`. Callers should also use paths-ignore
# on push (e.g. k8s/**, .github/**) so overlay-only commits do not retrigger
# this workflow.
# ==============================================================================

name: AI Release Bump

on:
  workflow_call:
    inputs:
      model:
        description: 'OpenAI model to use for semver classification'
        required: false
        type: string
        default: 'gpt-5.6-luna'
      default_bump:
        description: 'Default bump type if AI classification fails'
        required: false
        type: string
        default: 'patch'
      initial_version:
        description: 'Initial version if no previous tags exist'
        required: false
        type: string
        default: 'v0.1.0'
      tag_prefix:
        description: 'Prefix for version tags'
        required: false
        type: string
        default: 'v'
      dry_run:
        description: 'If true, compute version but do not create release'
        required: false
        type: boolean
        default: false
      version_update_script:
        description: 'Shell commands to update version files before creating the release. Env vars available: VERSION (bare, e.g. 1.2.3), TAG (with prefix, e.g. v1.2.3). Follow-up pushes use chore bump message + bump-guard so auto-release does not loop.'
        required: false
        type: string
        default: ''
      update_changelog:
        description: 'If true, promote `## [Unreleased]` to `## [vX.Y.Z] — YYYY-MM-DD` in the changelog file before tagging.'
        required: false
        type: boolean
        default: true
      changelog_path:
        description: 'Path of the changelog file to promote when update_changelog is true.'
        required: false
        type: string
        default: 'CHANGELOG.md'
      unreleased_heading:
        description: 'Heading used for the unreleased section in the changelog (must match exactly).'
        required: false
        type: string
        default: '## [Unreleased]'

      # ======================================================================
      # Pre-release image scan gate
      # ======================================================================
      image_scan_enabled:
        description: >
          Block release creation on a Trivy scan of the dev image that
          release-promote.yml will promote, pinned by digest. Skipped when the
          release will rebuild (hotfix / direct push), since no image exists yet;
          release-promote.yml scans the rebuilt image. Opt-in (default false) so
          repos without a container image keep the previous behaviour.
          Requires image_name, dev_gcp_project_id and the WIF secrets.
        required: false
        type: boolean
        default: false
      image_name:
        description: 'Docker image name in the dev registry (required when image_scan_enabled).'
        required: false
        type: string
        default: ''
      dev_gcp_project_id:
        description: 'Dev GCP project id holding the image to scan (required when image_scan_enabled).'
        required: false
        type: string
        default: ''
      registry:
        description: 'Artifact Registry host for the dev image.'
        required: false
        type: string
        default: 'europe-west1-docker.pkg.dev'
      repository:
        description: 'Artifact Registry repository name for the dev image.'
        required: false
        type: string
        default: 'nt-docker'
      image_tag_prefix:
        description: 'Prefix applied to dev image tags (mirrors release-promote tag_prefix, e.g. "gpu-").'
        required: false
        type: string
        default: ''
      image_tag_suffix:
        description: 'Suffix applied to dev image tags (mirrors release-promote tag_suffix).'
        required: false
        type: string
        default: ''
      dev_branch:
        description: 'Development branch whose merges into main promote a dev image (mirrors release-promote dev_branch).'
        required: false
        type: string
        default: 'develop'
      promote_ignore_paths:
        description: >
          Newline-separated git pathspecs that cannot reach the built image
          (mirrors release-promote promote_ignore_paths). Pass the same value as
          the repo's release.yml, so the gate scans the image that will ship.
        required: false
        type: string
        default: |
          k8s/**
          .github/**
          CHANGELOG.md
      image_scan_severity:
        description: 'Trivy severity levels for the pre-release image scan.'
        required: false
        type: string
        default: 'CRITICAL,HIGH'
      accept_vulnerability_risk:
        description: >
          Log pre-release scan findings without blocking. Accepted CVEs should be
          documented in the repo root .trivyignore with a revisit date.
        required: false
        type: boolean
        default: false
    secrets:
      OPENAI_API_KEY:
        required: true
        description: 'OpenAI API key for semver classification'
      GH_TOKEN:
        required: true
        description: 'GitHub PAT with contents:write — needed to trigger release.yml'
      WIF_PROVIDER:
        required: false
        description: 'GCP Workload Identity Federation provider (required when image_scan_enabled)'
      WIF_SERVICE_ACCOUNT:
        required: false
        description: 'GCP service account email for WIF (required when image_scan_enabled)'
      SLACK_WEBHOOK_URL:
        required: false
        description: 'Slack Incoming Webhook URL. Used only when release creation fails.'
    outputs:
      new_version:
        description: 'The new version tag (e.g., v1.2.3)'
        value: ${{ jobs.bump.outputs.new_version }}
      bump_type:
        description: 'The bump type (major, minor, patch)'
        value: ${{ jobs.bump.outputs.bump_type }}
      previous_version:
        description: 'The previous version tag'
        value: ${{ jobs.bump.outputs.previous_version }}

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    name: AI Semver Bump
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      skip: ${{ steps.bump-guard.outputs.skip }}
      has_commits: ${{ steps.commits.outputs.has_commits }}
      new_version: ${{ steps.version.outputs.new_version }}
      bump_type: ${{ steps.ai.outputs.bump_type }}
      reason: ${{ steps.ai.outputs.reason }}
      previous_version: ${{ steps.latest-tag.outputs.tag }}
      commit_log: ${{ steps.commits.outputs.log }}

    permissions:
      contents: read

    steps:
      - name: Skip if push is only the automated version bump or a changelog feed
        id: bump-guard
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          skip=false
          reason=""
          if [ -n "${HEAD_MSG:-}" ]; then
            if printf '%s' "$HEAD_MSG" | grep -q 'chore: bump version to'; then
              skip=true
              reason="automated semver file bump"
            elif printf '%s' "$HEAD_MSG" | grep -q '^docs(changelog):'; then
              skip=true
              reason="openspec changelog feed commit"
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          if [ "$skip" = "true" ]; then
            echo "Skipping: $reason."
          fi

      - name: Checkout code
        if: steps.bump-guard.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Get latest version tag
        id: latest-tag
        if: steps.bump-guard.outputs.skip != 'true'
        run: |
          # Find the latest semver tag (v*.*.*)
          LATEST_TAG=$(git tag -l '${{ inputs.tag_prefix }}*' --sort=-v:refname | head -1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No previous version tags found."
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          else
            echo "Latest tag: $LATEST_TAG"
            echo "tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
            # Strip tag prefix to get version number
            VERSION="${LATEST_TAG#${{ inputs.tag_prefix }}}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Get commits since last release
        id: commits
        if: steps.bump-guard.outputs.skip != 'true'
        run: |
          if [ -n "${{ steps.latest-tag.outputs.tag }}" ]; then
            COMMITS=$(git log ${{ steps.latest-tag.outputs.tag }}..HEAD --pretty=format:"- %h %s" 2>/dev/null)
            COMMIT_COUNT=$(git log ${{ steps.latest-tag.outputs.tag }}..HEAD --oneline | wc -l | tr -d ' ')
          else
            COMMITS=$(git log --pretty=format:"- %h %s" -50)
            COMMIT_COUNT=$(git log --oneline | wc -l | tr -d ' ')
          fi

          if [ -z "$COMMITS" ] || [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No new commits since last release."
            echo "has_commits=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found $COMMIT_COUNT commits since last release."
          {
            echo "has_commits=true"
            echo "count=${COMMIT_COUNT}"
          } >> "$GITHUB_OUTPUT"

          # Write commits to a scratch file OUTSIDE the repo working tree.
          # Anything left in the checkout would be swept up by the later
          # `git add .` in git-commit-push, producing a bogus bump commit that
          # the release tag then points at — which breaks promote detection in
          # release-promote.yml (it looks for the develop→main merge commit).
          echo "$COMMITS" > "${RUNNER_TEMP}/commits.txt"

          # Also set as output (truncated for safety)
          TRUNCATED=$(echo "$COMMITS" | head -100)
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "log<<${EOF}"
            echo "${TRUNCATED}"
            echo "${EOF}"
          } >> "$GITHUB_OUTPUT"

      - name: AI determines semver bump
        id: ai
        if: steps.bump-guard.outputs.skip != 'true' && steps.commits.outputs.has_commits == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          write_output() {
            local name="$1"
            local value="$2"
            local eof
            eof=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            {
              echo "${name}<<${eof}"
              printf '%s\n' "$value"
              echo "${eof}"
            } >> "$GITHUB_OUTPUT"
          }

          # Scratch files live under RUNNER_TEMP (outside the repo) so they are
          # never picked up by the `git add .` in the later commit step.
          REQUEST_JSON="${RUNNER_TEMP}/request.json"
          COMMITS_TXT="${RUNNER_TEMP}/commits.txt"

          # Reasoning models reject `max_tokens` (use `max_completion_tokens`)
          # and any `temperature` other than the default, so neither is sent.
          # The budget covers unseen reasoning tokens as well as the ~20-token
          # answer; too low and the model spends it all reasoning and returns
          # empty content with finish_reason=length.
          cat > "$REQUEST_JSON" << 'REQEOF'
          {
            "model": "${{ inputs.model }}",
            "response_format": { "type": "json_object" },
            "messages": [
              {
                "role": "system",
                "content": "You are a semver expert. Given a list of git commits, determine the appropriate version bump according to https://semver.org/\n\nRules:\n- MAJOR: incompatible API changes, breaking changes (look for: 'BREAKING CHANGE', 'breaking:', major refactors that change interfaces)\n- MINOR: new features, new endpoints, new capabilities added in a backward-compatible manner (look for: 'feat:', 'feature:', 'add:', new functionality)\n- PATCH: bug fixes, documentation, refactoring, dependency updates, CI changes, tests (look for: 'fix:', 'docs:', 'refactor:', 'chore:', 'ci:', 'test:')\n\nWhen in doubt, prefer PATCH over MINOR, and MINOR over MAJOR.\n\nRespond with ONLY a JSON object:\n{\"bump\": \"major|minor|patch\", \"reason\": \"one sentence explanation\"}"
              },
              {
                "role": "user",
                "content": COMMITS_PLACEHOLDER
              }
            ],
            "max_completion_tokens": 2000
          }
          REQEOF

          # Replace placeholder with actual commits (handles special characters).
          # Paths/version passed via env so untrusted values aren't interpolated
          # into the python source.
          REQUEST_JSON="$REQUEST_JSON" COMMITS_TXT="$COMMITS_TXT" \
          CUR_VERSION="${{ steps.latest-tag.outputs.version }}" python3 - <<'PY'
          import json, os
          req = os.environ["REQUEST_JSON"]
          with open(req) as f:
              data = f.read()
          with open(os.environ["COMMITS_TXT"]) as f:
              commits = f.read()
          payload = "Current version: " + os.environ["CUR_VERSION"] + "\n\nCommits since last release:\n" + commits
          data = data.replace("COMMITS_PLACEHOLDER", json.dumps(payload))
          with open(req, "w") as f:
              f.write(data)
          PY

          # Call OpenAI API
          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d @"$REQUEST_JSON")

          # Check for API errors
          if echo "$RESPONSE" | jq -e '.error' > /dev/null 2>&1; then
            ERROR=$(echo "$RESPONSE" | jq -r '.error.message')
            echo "::warning::OpenAI API error: $ERROR — defaulting to ${{ inputs.default_bump }}"
            echo "bump_type=${{ inputs.default_bump }}" >> "$GITHUB_OUTPUT"
            write_output "reason" "OpenAI API error, defaulting to ${{ inputs.default_bump }}"
            exit 0
          fi

          # Extract the classification
          AI_RESPONSE=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // ""')

          # A reasoning model that exhausts its budget returns HTTP 200 with
          # empty content, which would otherwise be reported as invalid JSON.
          if [ -z "${AI_RESPONSE//[[:space:]]/}" ]; then
            FINISH_REASON=$(echo "$RESPONSE" | jq -r '.choices[0].finish_reason // "unknown"')
            echo "::warning::Empty AI response (finish_reason=${FINISH_REASON}) — defaulting to ${{ inputs.default_bump }}"
            echo "bump_type=${{ inputs.default_bump }}" >> "$GITHUB_OUTPUT"
            write_output "reason" "Empty AI response, defaulting to ${{ inputs.default_bump }}"
            exit 0
          fi

          if ! echo "$AI_RESPONSE" | jq empty 2>/dev/null; then
            echo "::warning::Invalid AI response — defaulting to ${{ inputs.default_bump }}"
            echo "bump_type=${{ inputs.default_bump }}" >> "$GITHUB_OUTPUT"
            write_output "reason" "Invalid AI response, defaulting to ${{ inputs.default_bump }}"
            exit 0
          fi

          BUMP_TYPE=$(echo "$AI_RESPONSE" | jq -r '.bump')
          REASON=$(echo "$AI_RESPONSE" | jq -r '.reason')

          # Validate bump type
          case "$BUMP_TYPE" in
            major|minor|patch) ;;
            *)
              echo "::warning::Invalid bump type '$BUMP_TYPE' — defaulting to ${{ inputs.default_bump }}"
              BUMP_TYPE="${{ inputs.default_bump }}"
              REASON="Invalid AI classification, defaulting to ${{ inputs.default_bump }}"
              ;;
          esac

          LOG_REASON=$(printf '%s' "$REASON" | sed 's/^::/: :/')
          echo "AI classification: $BUMP_TYPE — $LOG_REASON"
          echo "bump_type=${BUMP_TYPE}" >> "$GITHUB_OUTPUT"
          write_output "reason" "$REASON"

      - name: Compute new version
        id: version
        if: steps.bump-guard.outputs.skip != 'true' && steps.commits.outputs.has_commits == 'true'
        run: |
          CURRENT="${{ steps.latest-tag.outputs.version }}"
          BUMP="${{ steps.ai.outputs.bump_type }}"
          PREFIX="${{ inputs.tag_prefix }}"

          # Handle initial version (no previous tags)
          if [ -z "$CURRENT" ] || [ "$CURRENT" = "0.0.0" ]; then
            NEW_VERSION="${{ inputs.initial_version }}"
            echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
            echo "Initial release: ${NEW_VERSION}"
            exit 0
          fi

          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${PREFIX}${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version bump: ${PREFIX}${CURRENT} → ${NEW_VERSION} ($BUMP)"

      - name: Skip — no new commits
        if: steps.bump-guard.outputs.skip != 'true' && steps.commits.outputs.has_commits != 'true'
        run: |
          echo "No new commits since last release. Skipping version bump."
          echo "## No Release Needed" >> "$GITHUB_STEP_SUMMARY"
          echo "No new commits since last release." >> "$GITHUB_STEP_SUMMARY"

      - name: Summary — skipped after version bump commit
        if: steps.bump-guard.outputs.skip == 'true'
        run: |
          echo "## Skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "Push is only the automated semver file bump; auto-release will not run again until substantive commits land." >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # Job 2: Resolve the image this release will ship (opt-in)
  # ============================================================================
  # Scans exactly the image release-promote.yml will promote, pinned by digest:
  # the same develop→main detection, then the same resolve-promote-source walk
  # and content-equivalence check. A pushed `main` commit never has a dev image
  # of its own (dev images are tagged with dev-branch SHAs), and `latest` is a
  # mutable tag that points at whatever develop built last — so neither is ever
  # scanned here.
  #
  # When the release will REBUILD (hotfix, direct push, main ahead of develop,
  # no built dev image) no image for it exists yet, so this gate cannot see it
  # and skips. release-promote.yml scans the rebuilt image before any overlay
  # moves. Scanning a stand-in instead is what blocked merged CVE fixes: the
  # fix was on `main`, the stand-in was not.
  resolve-image:
    name: Resolve Release Image
    needs: bump
    if: |
      inputs.image_scan_enabled &&
      needs.bump.outputs.skip != 'true' &&
      needs.bump.outputs.has_commits == 'true' &&
      inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      # 'true' when a promote source was resolved and must pass the scan.
      scan: ${{ steps.resolve.outputs.scan }}
      # Digest-pinned reference handed to Trivy.
      image_ref: ${{ steps.resolve.outputs.image_ref }}
      # Human-readable tag reference of the same image, for notifications.
      image_label: ${{ steps.resolve.outputs.image_label }}
      # Why the scan was skipped (the release will rebuild).
      skip_reason: ${{ steps.resolve.outputs.skip_reason }}
      # Set only by the lookup itself. Empty means the job died before the
      # lookup ran (auth, crane install, registry login), which is a different
      # problem from a missing image and must not be reported as one.
      failure_reason: ${{ steps.resolve.outputs.failure_reason }}

    steps:
      - name: Validate scan inputs
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          DEV_PROJECT: ${{ inputs.dev_gcp_project_id }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${IMAGE_NAME}" ] || missing="${missing} image_name"
          [ -n "${DEV_PROJECT}" ] || missing="${missing} dev_gcp_project_id"
          if [ -n "${missing}" ]; then
            echo "::error::image_scan_enabled is true but required input(s) are empty:${missing}"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      # Mirrors the "Detect release strategy" step of release-promote.yml, run
      # against the pushed commit instead of the release tag. If the two drift,
      # the only cost is when a bad image is caught: release-promote.yml scans
      # whatever it actually ships either way.
      - name: Detect promote candidate
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          DEV_BRANCH: ${{ inputs.dev_branch }}
        run: |
          set -uo pipefail

          # Signal A: commit is associated with a merged dev→main PR (handles
          # squash merges, where there is no second parent). Emits the PR JSON.
          dev_pr_head() {
            local sha="$1" data pr
            data=$(gh api "repos/${REPO}/commits/${sha}/pulls" 2>/dev/null || echo '[]')
            pr=$(echo "$data" | jq -r --arg dev "$DEV_BRANCH" '
              [.[] | objects | select(
                .base.ref == "main" and
                (.head.ref == $dev or .head.ref == "dev") and
                .merged_at != null
              )] | first // empty' 2>/dev/null || echo '')
            { [ -n "$pr" ] && [ "$pr" != "null" ]; } || return 1
            echo "$pr"
          }

          # Signal B: commit is a merge whose second parent lives on the dev branch.
          dev_merge_parent() {
            local sha="$1" pcount dev_sha
            pcount=$(git cat-file -p "$sha" 2>/dev/null | grep -c '^parent ' || true)
            [ "$pcount" -gt 1 ] || return 1
            dev_sha=$(git rev-parse "${sha}^2" 2>/dev/null) || return 1
            git branch -r --contains "$dev_sha" 2>/dev/null \
              | grep -qE "origin/(${DEV_BRANCH}|dev)$" || return 1
            echo "$dev_sha"
          }

          CANDIDATE="$RELEASE_SHA"
          RESULT="rebuild"
          DEV_SHA=""

          # Step over automated commits only, as release-promote.yml does; a
          # human commit means hotfix / direct push.
          for _ in 1 2 3 4 5; do
            if PR=$(dev_pr_head "$CANDIDATE"); then
              DEV_SHA=$(echo "$PR" | jq -r '.head.sha')
              echo "Merged PR #$(echo "$PR" | jq -r '.number') from ${DEV_BRANCH} → main at ${CANDIDATE}"
              RESULT="promote"
              break
            fi
            if DEV_SHA=$(dev_merge_parent "$CANDIDATE"); then
              echo "Merge commit ${CANDIDATE}: second parent ${DEV_SHA} is on ${DEV_BRANCH}"
              RESULT="promote"
              break
            fi
            MSG=$(git log -1 --format=%s "$CANDIDATE" 2>/dev/null || echo '')
            case "$MSG" in
              "chore: bump version"*|"docs(changelog):"*)
                PARENT=$(git rev-parse "${CANDIDATE}^" 2>/dev/null || echo '')
                [ -n "$PARENT" ] || break
                echo "Stepping over automated commit ${CANDIDATE} → parent ${PARENT}"
                CANDIDATE="$PARENT"
                ;;
              *)
                echo "No ${DEV_BRANCH}→main PR or merge at ${CANDIDATE} — hotfix or direct push"
                break
                ;;
            esac
          done

          {
            echo "initial=${RESULT}"
            echo "dev_sha=${DEV_SHA}"
            echo "candidate_sha=${CANDIDATE}"
          } >> "$GITHUB_OUTPUT"

      - name: Compute dev image base
        id: meta
        env:
          REGISTRY: ${{ inputs.registry }}
          DEV_PROJECT: ${{ inputs.dev_gcp_project_id }}
          REPOSITORY: ${{ inputs.repository }}
          IMAGE_NAME: ${{ inputs.image_name }}
        run: echo "dev_image_base=${REGISTRY}/${DEV_PROJECT}/${REPOSITORY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      # Registry access is only needed when there is a dev image to look up, so
      # a hotfix release does not depend on GCP auth here.
      - name: Authenticate to Google Cloud
        id: auth
        if: steps.detect.outputs.initial == 'promote'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false

      - name: Install crane
        if: steps.detect.outputs.initial == 'promote'
        uses: NeuralTrust/workflows/.github/actions/setup-crane@main

      - name: Login to Artifact Registry (crane)
        if: steps.detect.outputs.initial == 'promote'
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          REGISTRY: ${{ inputs.registry }}
        run: |
          set -euo pipefail
          echo "$ACCESS_TOKEN" | crane auth login "$REGISTRY" -u oauth2accesstoken --password-stdin

      - name: Resolve promote source
        id: source
        if: steps.detect.outputs.initial == 'promote'
        uses: NeuralTrust/workflows/.github/actions/resolve-promote-source@main
        with:
          dev_sha: ${{ steps.detect.outputs.dev_sha }}
          candidate_sha: ${{ steps.detect.outputs.candidate_sha }}
          dev_image_base: ${{ steps.meta.outputs.dev_image_base }}
          tag_prefix: ${{ inputs.image_tag_prefix }}
          tag_suffix: ${{ inputs.image_tag_suffix }}
          ignore_paths: ${{ inputs.promote_ignore_paths }}

      - name: Resolve release image
        id: resolve
        env:
          INITIAL: ${{ steps.detect.outputs.initial }}
          CANDIDATE_SHA: ${{ steps.detect.outputs.candidate_sha }}
          SOURCE_STRATEGY: ${{ steps.source.outputs.strategy }}
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
          SOURCE_REASON: ${{ steps.source.outputs.reason }}
          DEV_BASE: ${{ steps.meta.outputs.dev_image_base }}
        run: |
          set -euo pipefail

          write_output() {
            local eof
            eof=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            { echo "$1<<${eof}"; printf '%s\n' "$2"; echo "${eof}"; } >> "$GITHUB_OUTPUT"
          }

          if [ "$INITIAL" != "promote" ]; then
            SKIP_REASON="no develop→main PR or merge at ${CANDIDATE_SHA} (hotfix / direct push)"
          elif [ "$SOURCE_STRATEGY" != "promote" ]; then
            SKIP_REASON="${SOURCE_REASON}"
          else
            SKIP_REASON=""
          fi

          if [ -n "$SKIP_REASON" ]; then
            echo "scan=false" >> "$GITHUB_OUTPUT"
            write_output skip_reason "$SKIP_REASON"
            echo "::notice title=Pre-release image scan skipped::This release will rebuild, so no image for it exists yet: ${SKIP_REASON}. release-promote.yml scans the rebuilt image before it reaches the prod overlays."
            {
              echo "## Pre-Release Image Scan Skipped"
              echo ""
              echo "This release will **rebuild**, so no image for it exists yet to scan."
              echo ""
              echo "- **Why:** ${SKIP_REASON}"
              echo "- **Gate:** \`release-promote.yml\` scans the rebuilt image and blocks the overlay update on HIGH/CRITICAL fixable CVEs."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Pin by digest: the tag is only how the image was found, and the
          # digest is what release-promote.yml copies byte-for-byte to prod.
          if ! DIGEST=$(crane digest "$SOURCE_REF" 2>/dev/null) || [ -z "$DIGEST" ]; then
            echo "::error::Could not read the digest of ${SOURCE_REF}."
            write_output failure_reason "Could not read the digest of the promote source ${SOURCE_REF}"
            exit 1
          fi

          IMAGE_REF="${DEV_BASE}@${DIGEST}"
          echo "Scanning ${SOURCE_REF} as ${IMAGE_REF}"
          {
            echo "scan=true"
            echo "image_ref=${IMAGE_REF}"
            echo "image_label=${SOURCE_REF}"
          } >> "$GITHUB_OUTPUT"

  # ============================================================================
  # Job 3: Blocking image vulnerability scan (opt-in)
  # ============================================================================
  scan: # zizmor: ignore[excessive-permissions]
    name: Pre-Release Image Scan
    needs: [bump, resolve-image]
    if: needs.resolve-image.outputs.scan == 'true'
    uses: NeuralTrust/workflows/.github/workflows/image-scan.yml@main
    # No `permissions:` here on purpose. A nested reusable-workflow call can only
    # narrow the caller's grant, never widen it, and GitHub validates this at
    # workflow-parse time — before `if:` is evaluated. Declaring `id-token: write`
    # therefore hard-fails every caller that does not already grant it, even when
    # image_scan_enabled is false. Callers that opt into the scan must grant
    # `id-token: write` themselves (see the usage example at the top).
    with:
      image_ref: ${{ needs.resolve-image.outputs.image_ref }}
      severity: ${{ inputs.image_scan_severity }}
      block_vulnerability_findings: true
      accept_vulnerability_risk: ${{ inputs.accept_vulnerability_risk }}
      upload_sarif: true
    secrets:
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}

  # ============================================================================
  # Job 4: Publish — version files, changelog, tag and GitHub Release
  # ============================================================================
  # Runs only when the scan gate passed (or was not requested). Nothing before
  # this job mutates the repo, so a blocked scan leaves no orphan tag, no bump
  # commit and no draft release to clean up.
  publish:
    name: Publish Release
    needs: [bump, resolve-image, scan]
    if: |
      always() &&
      needs.bump.result == 'success' &&
      needs.bump.outputs.skip != 'true' &&
      needs.bump.outputs.has_commits == 'true' &&
      inputs.dry_run == false &&
      (needs.resolve-image.result == 'success' || needs.resolve-image.result == 'skipped') &&
      (needs.scan.result == 'success' || needs.scan.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Restore commit log
        # The log is passed as a job output rather than an artifact: it is the
        # same truncated list (100 commits) already used for the AI prompt, and
        # a job output avoids an artifact round-trip for a few KB of text.
        env:
          COMMIT_LOG: ${{ needs.bump.outputs.commit_log }}
        run: printf '%s\n' "$COMMIT_LOG" > "${RUNNER_TEMP}/commits.txt"

      - name: Promote CHANGELOG Unreleased → versioned section
        if: inputs.update_changelog == true
        env:
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
          UNRELEASED_HEADING: ${{ inputs.unreleased_heading }}
          NEW_VERSION: ${{ needs.bump.outputs.new_version }}
        run: |
          if [ ! -f "${CHANGELOG_PATH}" ]; then
            echo "${CHANGELOG_PATH} does not exist; skipping promotion."
            exit 0
          fi
          python3 - <<'PY'
          """Promote `## [Unreleased]` to `## [vX.Y.Z] — YYYY-MM-DD`.

          The Unreleased section is preserved (left empty) so future PRs keep
          appending to it. If the Unreleased section has no body, no promotion
          happens and the file is left untouched.
          """
          import os
          import re
          import sys
          from datetime import date
          from pathlib import Path

          path = Path(os.environ["CHANGELOG_PATH"])
          heading = os.environ["UNRELEASED_HEADING"]
          new_version = os.environ["NEW_VERSION"]

          text = path.read_text(encoding="utf-8")
          if heading not in text:
              print(f"Heading {heading!r} not found in {path}; skipping promotion.")
              sys.exit(0)

          lines = text.splitlines()
          start = None
          end = len(lines)
          for i, line in enumerate(lines):
              if line.strip() == heading:
                  start = i + 1
                  continue
              if start is not None and line.startswith("## "):
                  end = i
                  break
          if start is None:
              print("Could not locate Unreleased bounds; skipping.")
              sys.exit(0)

          body = lines[start:end]
          while body and not body[0].strip():
              body.pop(0)
          while body and not body[-1].strip():
              body.pop()

          if not body:
              print("Unreleased section is empty; nothing to promote.")
              sys.exit(0)

          today = date.today().isoformat()
          new_section = [heading, "", f"## [{new_version}] — {today}", ""] + body + [""]
          rebuilt = lines[: start - 1] + new_section + lines[end:]
          out = "\n".join(rebuilt).rstrip() + "\n"
          path.write_text(out, encoding="utf-8")
          print(f"Promoted Unreleased → {new_version} in {path}.")
          PY

      - name: Update version files
        if: inputs.version_update_script != ''
        env:
          TAG: ${{ needs.bump.outputs.new_version }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          # Strip tag prefix to get bare version (e.g. v1.2.3 → 1.2.3)
          VERSION="${TAG#"$TAG_PREFIX"}"
          export VERSION

          echo "Updating version files to ${VERSION} (tag: ${TAG})..."
          set -e
          ${{ inputs.version_update_script }}

      - name: Commit and push version files
        id: commit-version
        uses: NeuralTrust/workflows/.github/actions/git-commit-push@main
        with:
          branch: ${{ github.ref_name }}
          message: "chore: bump version to ${{ needs.bump.outputs.new_version }}"
          paths: |
            .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VERSION: ${{ needs.bump.outputs.new_version }}
          BUMP: ${{ needs.bump.outputs.bump_type }}
          REASON: ${{ needs.bump.outputs.reason }}
          PREVIOUS: ${{ needs.bump.outputs.previous_version }}
          VERSION_COMMIT_SHA: ${{ steps.commit-version.outputs.sha }}
          SCANNED_IMAGE: ${{ needs.resolve-image.outputs.image_ref }}
          SCANNED_LABEL: ${{ needs.resolve-image.outputs.image_label }}
          SCAN_SKIP_REASON: ${{ needs.resolve-image.outputs.skip_reason }}
        run: |
          # Use the version-commit SHA if we pushed one, otherwise the original SHA
          TARGET_SHA="${VERSION_COMMIT_SHA}"
          if [ -z "$TARGET_SHA" ] || [ "$TARGET_SHA" = "" ]; then
            TARGET_SHA="${{ github.sha }}"
          fi

          # Build release notes. Consuming repos (e.g. neuraltrust-platform
          # publish-chart.yml) append Container images + Installation after this.
          # Scratch files under RUNNER_TEMP so they never enter a commit.
          RELEASE_NOTES="${RUNNER_TEMP}/release_notes.md"
          cat > "$RELEASE_NOTES" << EOF
          ## What changed

          **${BUMP} release** — ${REASON}

          ### Commits

          $(cat "${RUNNER_TEMP}/commits.txt")
          EOF

          if [ -n "$PREVIOUS" ]; then
            TITLE="${VERSION} (from ${PREVIOUS})"
          else
            TITLE="${VERSION} (initial release)"
          fi

          echo "Creating release: $VERSION (target: ${TARGET_SHA})"
          gh release create "$VERSION" \
            --title "$TITLE" \
            --notes-file "$RELEASE_NOTES" \
            --target "$TARGET_SHA"

          {
            echo "## Release Created"
            echo ""
            echo "- **Version:** \`${VERSION}\`"
            echo "- **Bump:** ${BUMP}"
            echo "- **Reason:** ${REASON}"
            echo "- **Previous:** \`${PREVIOUS:-none}\`"
            if [ -n "${SCANNED_IMAGE}" ]; then
              echo "- **Scanned image:** \`${SCANNED_IMAGE}\` (\`${SCANNED_LABEL}\`, passed the blocking Trivy gate)"
            elif [ -n "${SCAN_SKIP_REASON}" ]; then
              echo "- **Pre-release scan:** skipped, the release will rebuild — ${SCAN_SKIP_REASON}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # Job 5: Slack + summary when a release was expected but not created
  # ============================================================================
  notify-failure:
    name: Notify Release Failure
    needs: [bump, resolve-image, scan, publish]
    if: |
      always() &&
      inputs.dry_run == false &&
      needs.bump.outputs.skip != 'true' &&
      (needs.bump.result == 'failure' ||
       (needs.bump.outputs.has_commits == 'true' &&
        (needs.resolve-image.result == 'failure' ||
         needs.scan.result == 'failure' ||
         needs.publish.result == 'failure')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Report failure and notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERSION: ${{ needs.bump.outputs.new_version }}
          IMAGE_REF: ${{ needs.resolve-image.outputs.image_ref }}
          IMAGE_LABEL: ${{ needs.resolve-image.outputs.image_label }}
          BUMP_RESULT: ${{ needs.bump.result }}
          RESOLVE_RESULT: ${{ needs.resolve-image.result }}
          RESOLVE_REASON: ${{ needs.resolve-image.outputs.failure_reason }}
          SCAN_RESULT: ${{ needs.scan.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SCAN_RESULT" = "failure" ]; then
            REASON="Pre-release image scan found HIGH/CRITICAL fixable CVEs"
            [ -n "$IMAGE_LABEL" ] && REASON="${REASON} in ${IMAGE_LABEL}"
            [ -n "$IMAGE_REF" ] && REASON="${REASON} (digest ${IMAGE_REF##*@})"
          elif [ "$RESOLVE_RESULT" = "failure" ]; then
            # Only the lookup sets RESOLVE_REASON. Without it the job failed
            # earlier — GCP auth, crane install or registry login — and calling
            # that a missing image sends the reader after the wrong problem.
            if [ -n "$RESOLVE_REASON" ]; then
              REASON="$RESOLVE_REASON"
            else
              REASON="Could not resolve the release image to scan; the job failed before the lookup ran (checkout, GCP auth or registry access). Check the run log and re-run — this is often transient"
            fi
          elif [ "$PUBLISH_RESULT" = "failure" ]; then
            REASON="Publish failed while creating the tag, version files, or GitHub Release"
          elif [ "$BUMP_RESULT" = "failure" ]; then
            REASON="Semver bump job failed before a version was computed"
          else
            REASON="Release was not created"
          fi

          {
            echo "## Release Not Created"
            echo ""
            echo "- **Version:** \`${VERSION:-unknown}\`"
            echo "- **Reason:** ${REASON}"
            if [ -n "${IMAGE_REF}" ]; then
              echo "- **Image:** \`${IMAGE_REF}\`"
              [ -n "${IMAGE_LABEL}" ] && echo "- **Found as:** \`${IMAGE_LABEL}\`"
            fi
            echo ""
            echo "No tag, version-bump commit or GitHub Release was produced."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Release ${VERSION:-unknown} was not created: ${REASON}"

          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::No Slack webhook configured; failure was not posted to Slack."
            exit 0
          fi

          curl -sf "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg repo "$REPO" \
              --arg version "${VERSION:-unknown}" \
              --arg reason "$REASON" \
              --arg url "$RUN_URL" \
              --arg actor "${GITHUB_ACTOR}" \
              '{
                "attachments": [{
                  "color": "#dc3545",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": (":x: *Release not created* | `" + $repo + "`")
                      }
                    },
                    {
                      "type": "section",
                      "text": {"type": "mrkdwn", "text": ("*Reason:* " + $reason)}
                    },
                    {
                      "type": "section",
                      "fields": [
                        {"type": "mrkdwn", "text": ("*Version:*\n`" + $version + "`")},
                        {"type": "mrkdwn", "text": ("*Actor:*\n" + $actor)},
                        {"type": "mrkdwn", "text": ("*Workflow:*\n<" + $url + "|View Run>")}
                      ]
                    }
                  ]
                }]
              }'
            )" || echo "::warning::Slack notification failed"
