# ==============================================================================
# Weekly Org Backup (scheduler) — hardened
# ==============================================================================
# Runs the hardened reusable repo-backup.yml weekly. Uses a dedicated backup
# GitHub App + isolated GCP WIF (BACKUP_* secrets), NOT org GH_TOKEN / PROD_WIF_*.
#
# Required org/repo secrets (NeuralTrust/workflows):
#   BACKUP_WIF_PROVIDER, BACKUP_WIF_SERVICE_ACCOUNT  — isolated backup GCP project
#   BACKUP_APP_ID, BACKUP_APP_PRIVATE_KEY             — read-only GitHub App
#   BACKUP_ALERT_WEBHOOK (optional)                   — Slack/Teams for anomalies
#
# Required repo variable:
#   GCS_BUCKET — e.g. nt-git-backups (in isolated GCP project)
# ==============================================================================

name: Weekly Org Backup

on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      repo_visibility:
        description: 'Which repositories to include'
        type: choice
        options: [all, public, private]
        default: all
      include_archived:
        description: 'Include archived repositories'
        type: boolean
        default: false
      fail_on_anomaly:
        description: 'Fail workflow when commit-count anomaly is detected'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-org-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository_owner == 'NeuralTrust'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/repo-backup.yml
    with:
      organization: NeuralTrust
      gcs_bucket: ${{ vars.GCS_BUCKET }}
      gcs_prefix: git-backups
      repo_visibility: ${{ inputs.repo_visibility || 'all' }}
      include_archived: ${{ inputs.include_archived || false }}
      max_parallel: 4
      retention_weeks: 3
      object_lock_enabled: true
      commit_count_drop_threshold: 30
      fail_on_anomaly: ${{ inputs.fail_on_anomaly || false }}
    secrets:
      WIF_PROVIDER: ${{ secrets.BACKUP_WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.BACKUP_WIF_SERVICE_ACCOUNT }}
      BACKUP_APP_ID: ${{ secrets.BACKUP_APP_ID }}
      BACKUP_APP_PRIVATE_KEY: ${{ secrets.BACKUP_APP_PRIVATE_KEY }}
      BACKUP_ALERT_WEBHOOK: ${{ secrets.BACKUP_ALERT_WEBHOOK }}
