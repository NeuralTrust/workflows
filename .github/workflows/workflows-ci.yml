# ==============================================================================
# Workflows CI — the "CI of CIs"
# ==============================================================================
# Every other NeuralTrust repo consumes the reusable workflows and composite
# actions in this repo, so a mistake here breaks pipelines org-wide. This
# workflow lints and security-audits this repo's own Actions surface on every
# change to .github/.
#
#   - actionlint: syntax, shellcheck on run: blocks, expression/type checks
#                 (BLOCKING — a broken workflow must never reach main)
#   - hygiene:    reusable-workflow rules that lints can't express (BLOCKING):
#                 composite actions must be referenced by full repo ref, never
#                 by local ./ path, and every reusable workflow must declare a
#                 workflow-level concurrency block. See scripts/workflow-hygiene.py.
#   - zizmor:     GitHub Actions security static analysis (BLOCKING, ratcheted).
#                 The repo carries ~150 pre-existing template-injection findings
#                 on `inputs.*`; those counts are pinned per file in
#                 .github/zizmor-baseline.json and a PR fails when any file goes
#                 above its baseline. New findings block; fixes are always
#                 allowed. The unpinned-uses audit is relaxed to "ref-pin" via
#                 .github/zizmor.yml since the repo pins to release tags and lets
#                 Dependabot bump them. SARIF is saved as a run artifact (we have
#                 no GitHub Advanced Security, so the Security tab isn't available).
# ==============================================================================

name: Workflows CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/zizmor.yml"
      - ".github/zizmor-baseline.json"
      - "scripts/workflow-hygiene.py"
      - "scripts/zizmor-ratchet.py"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/zizmor.yml"
      - ".github/zizmor-baseline.json"
      - "scripts/workflow-hygiene.py"
      - "scripts/zizmor-ratchet.py"
  workflow_dispatch:

# Least privilege by default; jobs opt into more where required.
permissions:
  contents: read

concurrency:
  group: workflows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run actionlint
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}:/repo" --workdir /repo \
            rhysd/actionlint:1.7.12 -color

  reusable-hygiene:
    name: reusable-workflow hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A reusable workflow runs in the CALLER's checkout, so `uses: ./...`
      # resolves against the consumer repo, not this one; and a reusable
      # workflow without a concurrency block gives callers no way to scope
      # queueing. Both rules are enforced by the same script so they can be
      # reproduced locally with `python3 scripts/workflow-hygiene.py`.
      - name: Run reusable-workflow hygiene checks
        run: python3 scripts/workflow-hygiene.py

  zizmor:
    name: zizmor (Actions security)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Produce both machine-readable JSON (for the ratchet gate) and SARIF (for
      # the artifact). --no-exit-codes keeps zizmor's own findings-present exit
      # status from failing the step; the ratchet below owns the pass/fail call.
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          uvx zizmor@1.25.2 --config .github/zizmor.yml \
            --no-exit-codes --format json . > zizmor.json
          uvx zizmor@1.25.2 --config .github/zizmor.yml \
            --no-exit-codes --format sarif . > zizmor.sarif

      # Blocking gate. Fails when any file exceeds its pinned finding count in
      # .github/zizmor-baseline.json, so new findings can't slip in while the
      # pre-existing template-injection debt is worked down.
      - name: Enforce zizmor baseline (ratchet)
        run: python3 scripts/zizmor-ratchet.py zizmor.json

      # We don't have GitHub Advanced Security, so SARIF can't go to the Security
      # tab. Save it as a downloadable artifact instead. Short retention.
      - name: Save zizmor SARIF report as artifact
        if: always() && hashFiles('zizmor.sarif') != ''
        uses: actions/upload-artifact@v7
        with:
          name: zizmor-sarif
          path: zizmor.sarif
          retention-days: 7
