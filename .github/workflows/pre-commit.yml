# ==============================================================================
# Reusable Workflow: Pre-commit
# ==============================================================================
# Runs the caller's .pre-commit-config.yaml on the pull request diff, so a hook
# skipped locally still fails the pull request:
#
#   - pre-commit stage hooks over base...head (`pre-commit run --from-ref
#     --to-ref`). Content checks look only at the lines the pull request adds.
#   - every commit subject in base..head is a Conventional Commit, and the head
#     branch is <type>/<slug>, for pull requests opened on or after
#     `branch_name_since` (older pull requests predate the rule).
#
# Pre-push hooks (unit tests, gosec) are not run here: the tests and SAST
# workflows already cover them. golangci-lint is skipped by default for the
# same reason, and because its hook only lints changes newer than HEAD.
#
# The NeuralTrust hooks live in a private repository. A GitHub App with
# contents:read on it provides the token; the job fails when the secrets are
# missing (for example on a fork pull request). Open-source repositories carry
# their own copy of the hooks instead: they set `nt_hooks_path` and pass no
# secrets.
#
# Promotes (head `develop`) and back-merges (head `main`) are skipped, green:
# their commits were checked on their own pull requests.
#
# Usage:
#
#   on:
#     pull_request:
#       branches: [main, develop]
#   concurrency:
#     group: pre-commit-${{ github.event.pull_request.number }}
#     cancel-in-progress: true
#   permissions:
#     contents: read
#   jobs:
#     pre-commit:
#       uses: NeuralTrust/workflows/.github/workflows/pre-commit.yml@main
#       secrets:
#         HOOKS_APP_ID: ${{ secrets.AGENTS_HUB_APP_ID }}
#         HOOKS_APP_PRIVATE_KEY: ${{ secrets.AGENTS_HUB_APP_PRIVATE_KEY }}
#
# Open-source repository with a vendored copy:
#
#       uses: NeuralTrust/workflows/.github/workflows/pre-commit.yml@main
#       with:
#         nt_hooks_path: tools/nt-hooks
#
# Status check (for rulesets): `pre-commit / pre-commit`, where the first part
# is the caller's job id.
# ==============================================================================

name: Pre-commit

on:
  workflow_call:
    inputs:
      go_version_file:
        description: "File the Go version is read from, relative to the repository root"
        required: false
        type: string
        default: go.mod
      skip:
        description: "Comma-separated hook ids to skip (pre-commit SKIP)"
        required: false
        type: string
        default: golangci-lint
      branch_name_since:
        description: "Check the head branch name and the commit messages on pull requests opened on or after this date (YYYY-MM-DD); empty checks the commit messages of every pull request and no branch names"
        required: false
        type: string
        default: "2026-12-01"
      hooks_repository:
        description: "Repository with the shared hooks (owner/name)"
        required: false
        type: string
        default: NeuralTrust/pre-commit-hooks
      nt_hooks_path:
        description: "Package of a vendored nt-hooks copy in the caller (e.g. tools/nt-hooks); set, the hooks repository is not fetched"
        required: false
        type: string
        default: ""
    secrets:
      HOOKS_APP_ID:
        description: "GitHub App id with contents:read on the hooks repository (not needed with nt_hooks_path)"
        required: false
      HOOKS_APP_PRIVATE_KEY:
        description: "Private key of that GitHub App"
        required: false

# No workflow-level `concurrency:` here — a reusable workflow cannot key a group
# per calling job (github.run_id/workflow/ref are identical across sibling and
# matrix jobs), so siblings would cancel each other. Callers declare their own.

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HOOKS_REPOSITORY: ${{ inputs.hooks_repository }}
        run: |
          echo "hooks_repo_name=${HOOKS_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != "pull_request" ]; then
            echo "::error::pre-commit runs on pull_request events only (got $EVENT)"
            exit 1
          fi
          case "$HEAD_REF" in
            develop|main)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "promote or back-merge (head $HEAD_REF): skipped" ;;
            *)
              echo "run=true" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Create hooks token
        id: app-token
        if: steps.decide.outputs.run == 'true' && inputs.nt_hooks_path == ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.HOOKS_APP_ID }}
          private-key: ${{ secrets.HOOKS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.decide.outputs.hooks_repo_name }}
          permission-contents: read

      - name: Checkout pull request
        if: steps.decide.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        if: steps.decide.outputs.run == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go_version_file }}
          cache: false

      - name: Set up Python
        if: steps.decide.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache pre-commit environments
        if: steps.decide.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Grant git read access to the hooks repository
        if: steps.decide.outputs.run == 'true' && inputs.nt_hooks_path == ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          HOOKS_REPOSITORY: ${{ inputs.hooks_repository }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          # Scoped to the hooks repository only; the checkout keeps no credentials.
          git config --global "http.https://github.com/${HOOKS_REPOSITORY}.extraheader" "AUTHORIZATION: basic $auth"
          git ls-remote --exit-code "https://github.com/${HOOKS_REPOSITORY}" HEAD >/dev/null

      - name: Install pre-commit
        if: steps.decide.outputs.run == 'true'
        run: python -m pip install --quiet "pre-commit>=3.5,<5"

      - name: Run pre-commit on the pull request diff
        if: steps.decide.outputs.run == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKIP: ${{ inputs.skip }}
        run: |
          set -euo pipefail
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          pre-commit run --show-diff-on-failure --color always --from-ref "$base" --to-ref "$HEAD_SHA"

      - name: Build nt-hooks
        id: nt-hooks
        if: steps.decide.outputs.run == 'true'
        env:
          HOOKS_REPOSITORY: ${{ inputs.hooks_repository }}
          NT_HOOKS_PATH: ${{ inputs.nt_hooks_path }}
        run: |
          set -euo pipefail
          if [ -n "$NT_HOOKS_PATH" ]; then
            go build -o "$RUNNER_TEMP/nt-hooks" "./${NT_HOOKS_PATH#./}"
            echo "nt-hooks from $NT_HOOKS_PATH"
            exit 0
          fi
          # The same tag the caller's .pre-commit-config.yaml pins.
          rev=$(python - "$HOOKS_REPOSITORY" <<'PY'
          import sys, yaml
          url = "https://github.com/" + sys.argv[1]
          with open(".pre-commit-config.yaml") as f:
              repos = yaml.safe_load(f)["repos"]
          print(next(r["rev"] for r in repos if r["repo"].removesuffix(".git") == url))
          PY
          )
          dest="$RUNNER_TEMP/hooks"
          # No .git suffix: the auth header above is scoped to this exact URL path.
          git clone --quiet --depth 1 --branch "$rev" "https://github.com/${HOOKS_REPOSITORY}" "$dest"
          (cd "$dest" && go build -o "$RUNNER_TEMP/nt-hooks" ./cmd/nt-hooks)
          echo "nt-hooks at $rev"

      - name: Check commit messages
        if: steps.decide.outputs.run == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OPENED_AT: ${{ github.event.pull_request.created_at }}
          SINCE: ${{ inputs.branch_name_since }}
        run: |
          set -euo pipefail
          if [ -n "$SINCE" ] && [[ "${OPENED_AT:0:10}" < "$SINCE" ]]; then
            echo "pull request opened before $SINCE: commit messages not checked"
            exit 0
          fi
          "$RUNNER_TEMP/nt-hooks" commit-range "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA"

      - name: Check branch name
        if: steps.decide.outputs.run == 'true' && inputs.branch_name_since != ''
        env:
          HEAD_REF: ${{ github.head_ref }}
          OPENED_AT: ${{ github.event.pull_request.created_at }}
          SINCE: ${{ inputs.branch_name_since }}
        run: |
          set -euo pipefail
          if [[ "${OPENED_AT:0:10}" < "$SINCE" ]]; then
            echo "pull request opened before $SINCE: branch name not checked"
            exit 0
          fi
          "$RUNNER_TEMP/nt-hooks" branch-name --branch "$HEAD_REF"
