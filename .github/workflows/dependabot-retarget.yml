# ==============================================================================
# Org-wide Dependabot retarget — security PRs onto develop
# ==============================================================================
# GitHub Dependabot security updates always open against the repository
# default branch. Every NeuralTrust repo still uses main as the default, so
# security PRs land on production. There is no organization setting and no
# dependabot.yml key that can change that.
#
# This workflow is the central control: it searches NeuralTrust for open
# Dependabot PRs against main and moves them onto develop when that branch
# exists. Archived repos and repos without develop are skipped. A single
# failed edit does not fail the job.
#
# Dependabot rebase can reset the base back to main, so this also runs on a
# schedule rather than only when a PR is opened.
#
# Requires org secret GH_TOKEN with repo scope across NeuralTrust.
# ==============================================================================

name: Dependabot retarget

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-retarget
  cancel-in-progress: false

jobs:
  retarget:
    name: Retarget Dependabot PRs to develop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Move Dependabot PRs from main to develop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_ORG: NeuralTrust
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_TOKEN is not set; cannot list or edit org PRs."
            exit 1
          fi

          python3 - <<'PYEOF'
          import json
          import os
          import subprocess

          org = os.environ["GH_ORG"]

          def gh_run(args):
              return subprocess.run(
                  ["gh", *args],
                  capture_output=True,
                  text=True,
              )

          def gh_json(args):
              result = gh_run(args)
              if result.returncode != 0:
                  raise RuntimeError(
                      f"gh {' '.join(args)} failed ({result.returncode}): "
                      f"{(result.stderr or result.stdout).strip()}"
                  )
              return json.loads(result.stdout) if result.stdout.strip() else []

          def repo_state(repo):
              result = gh_run([
                  "api",
                  f"repos/{repo}",
                  "--jq",
                  "{archived: .archived}",
              ])
              if result.returncode != 0:
                  return {"archived": True, "has_develop": False}
              archived = json.loads(result.stdout).get("archived", False)
              if archived:
                  return {"archived": True, "has_develop": False}
              develop = gh_run([
                  "api",
                  f"repos/{repo}/branches/develop",
                  "--jq",
                  ".name",
              ])
              return {"archived": False, "has_develop": develop.returncode == 0}

          prs = gh_json([
              "search",
              "prs",
              "--owner",
              org,
              "--app",
              "dependabot",
              "--state",
              "open",
              "--base",
              "main",
              "--archived=false",
              "--limit",
              "1000",
              "--json",
              "number,repository,url",
          ])

          retargeted = 0
          skipped_no_develop = 0
          skipped_archived = 0
          failed = 0
          cache = {}

          for pr in prs:
              repo = pr["repository"]["nameWithOwner"]
              number = pr["number"]
              if repo not in cache:
                  cache[repo] = repo_state(repo)
              state = cache[repo]
              if state["archived"]:
                  print(f"Skip {repo}#{number}: repository is archived")
                  skipped_archived += 1
                  continue
              if not state["has_develop"]:
                  print(f"Skip {repo}#{number}: no develop branch")
                  skipped_no_develop += 1
                  continue
              print(f"Retargeting {repo}#{number} main -> develop", flush=True)
              result = gh_run([
                  "pr",
                  "edit",
                  str(number),
                  "--repo",
                  repo,
                  "--base",
                  "develop",
              ])
              if result.returncode != 0:
                  err = (result.stderr or result.stdout).strip()
                  print(f"Failed {repo}#{number}: {err}", flush=True)
                  failed += 1
                  continue
              retargeted += 1

          print(
              f"Found {len(prs)} open Dependabot PR(s) targeting main; "
              f"skipped {skipped_no_develop} without develop; "
              f"skipped {skipped_archived} archived; "
              f"retargeted {retargeted}; "
              f"failed {failed}."
          )
          if retargeted:
              print(f"::notice::{retargeted} Dependabot PR(s) retargeted to develop.")
          if failed:
              print(f"::warning::{failed} Dependabot PR(s) could not be retargeted.")
          PYEOF
