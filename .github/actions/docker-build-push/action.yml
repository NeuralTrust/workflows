# With `scan_before_push: 'true'` the image is built once without pushing,
# loaded into the local daemon and scanned there. Only a passing scan reaches
# the push step, so an image carrying fixable CRITICAL/HIGH vulnerabilities
# never exists in the registry — the gate runs on the exact artifact that would
# have been pushed, not on a copy of it. The push step then rebuilds against
# the same builder, so every layer is a local cache hit.

name: Docker Build and Push
description: >-
  Build and push a Docker image to Artifact Registry with shared NeuralTrust
  tagging, optionally gated on a vulnerability scan of the built image.

inputs:
  image_name:
    description: Docker image name in the registry.
    required: true
  gcp_project_id:
    description: GCP project ID that owns the Artifact Registry.
    required: true
  registry:
    description: Artifact Registry host.
    required: false
    default: europe-west1-docker.pkg.dev
  repository:
    description: Artifact Registry repository name.
    required: false
    default: nt-docker
  dockerfile:
    description: Path to Dockerfile relative to context.
    required: false
    default: Dockerfile
  context:
    description: Docker build context path.
    required: false
    default: .
  build_target:
    description: Docker build target for multi-stage builds.
    required: false
    default: ''
  build_args:
    description: Newline-separated non-secret build args.
    required: false
    default: ''
  build_secrets:
    description: Newline-separated secret build args.
    required: false
    default: ''
  docker_secrets:
    description: Newline-separated Docker build secrets.
    required: false
    default: ''
  access_token:
    description: GCP access token for Artifact Registry login and Docker build secrets.
    required: true
  app_version:
    description: APP_VERSION build arg value.
    required: true
  primary_tag:
    description: Primary Docker tag before optional prefix/suffix. Defaults to the commit SHA.
    required: false
    default: ''
  tag_prefix:
    description: Prefix for all image tags.
    required: false
    default: ''
  tag_suffix:
    description: Suffix for all image tags.
    required: false
    default: ''
  extra_tags:
    description: Comma-separated extra tags to push.
    required: false
    default: ''
  include_git_tag:
    description: Also tag with the git ref name when running on a tag ref.
    required: false
    default: 'false'
  cache_mode:
    description: >-
      Buildx cache export mode. "inline" (default) embeds cache metadata in the
      final image only — intermediate stages are not reusable. "max" exports
      every stage to the registry cache ref so multi-stage layer caching works.
    required: false
    default: inline
  build_cache_stage:
    description: >-
      Name of a Dockerfile stage whose entire filesystem is a compiler cache
      (e.g. `FROM scratch` + `COPY --from=builder /app/.next/cache /`). After
      the main build this stage is pushed to `<image>:<prefix>buildcache<suffix>`
      and fed back into the next run through `build_cache_context`.
      Layer caching alone cannot carry a compiler cache: a `--mount=type=cache`
      lives only inside one BuildKit session and hosted runners get a fresh
      builder every run, so the contents must travel as a real layer.
      Requires build_cache_context. Empty (default) disables this.
      DO NOT combine with cache_mode: max. mode=max exports every layer in the
      build graph to the cache ref, so the cache is compressed and pushed twice
      per run. Measured on a 170MB (compressed) Next.js cache: registry cache
      export went from 20s to 199s, plus a 70s second push and ~60s to unpack
      the seed layer — 330s of transfer to save 104s of compile.
    required: false
    default: ''
  build_cache_context:
    description: >-
      Named build context the Dockerfile reads the previous cache from. Must
      match a `FROM scratch AS <name>` stage, which buildx overrides when the
      cache image exists and which stays empty on the first run.
      Required when build_cache_stage is set.
    required: false
    default: ''
  scan_before_push:
    description: >-
      Scan the image before it is pushed and fail the build on findings. The
      image is built once with `load: true` instead of `push: true`, scanned in
      the local daemon, and only then pushed. Off by default so existing
      callers are unaffected.
    required: false
    default: 'false'
  scan_severity:
    description: Severities the pre-push scan gates on.
    required: false
    default: 'CRITICAL,HIGH'
  scan_ignore_unfixed:
    description: >-
      Ignore vulnerabilities with no fix available. Findings nobody can act on
      would otherwise block every push indefinitely.
    required: false
    default: 'true'
  scan_scanners:
    description: Trivy scanners for the pre-push scan.
    required: false
    default: 'vuln'
  accept_vulnerability_risk:
    description: >-
      Report pre-push findings as warnings and push anyway. An explicit,
      reviewable override for an urgent deploy — visible in the caller's
      workflow, unlike a silent ignore file.
    required: false
    default: 'false'
  trivyignore_path:
    description: >-
      Path to a Trivy ignore file. Empty auto-detects `.trivyignore` at the
      repository root.
    required: false
    default: ''

outputs:
  image_base:
    description: Base image reference without tag.
    value: ${{ steps.meta.outputs.image_base }}
  image_ref:
    description: Full image reference with primary tag.
    value: ${{ steps.meta.outputs.image_ref }}
  image_tag:
    description: Primary image tag.
    value: ${{ steps.meta.outputs.image_tag }}
  cache_ref:
    description: Cache image reference.
    value: ${{ steps.meta.outputs.cache_ref }}
  buildcache_ref:
    description: Compiler-cache image reference.
    value: ${{ steps.meta.outputs.buildcache_ref }}
  latest_ref:
    description: Latest image reference.
    value: ${{ steps.meta.outputs.latest_ref }}
  tags:
    description: Comma-separated Docker tags passed to buildx.
    value: ${{ steps.meta.outputs.tags }}
  has_git_tag:
    description: Whether a git ref tag was added.
    value: ${{ steps.meta.outputs.has_git_tag }}
  scan_result:
    description: >-
      Pre-push scan outcome: passed, blocked or accepted-risk. Empty when
      scan_before_push is off.
    value: ${{ steps.scan_enforce.outputs.result }}
  scan_blocked:
    description: >-
      'true' only when the pre-push scan blocked the push, empty otherwise, so
      a passing matrix leg cannot overwrite a blocked one. Best-effort on the
      blocking path — the job failing is the reliable signal.
    value: ${{ steps.scan_enforce.outputs.blocked }}

runs:
  using: composite
  steps:
    - name: Compute image metadata
      id: meta
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        GCP_PROJECT_ID: ${{ inputs.gcp_project_id }}
        REPOSITORY: ${{ inputs.repository }}
        IMAGE_NAME: ${{ inputs.image_name }}
        PRIMARY_TAG: ${{ inputs.primary_tag }}
        TAG_PREFIX: ${{ inputs.tag_prefix }}
        TAG_SUFFIX: ${{ inputs.tag_suffix }}
        EXTRA_TAGS: ${{ inputs.extra_tags }}
        INCLUDE_GIT_TAG: ${{ inputs.include_git_tag }}
        CACHE_MODE: ${{ inputs.cache_mode }}
      run: |
        set -euo pipefail

        image_base="${REGISTRY}/${GCP_PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}"
        primary="${PRIMARY_TAG:-$GITHUB_SHA}"
        image_tag="${TAG_PREFIX}${primary}${TAG_SUFFIX}"
        cache_ref="${image_base}:${TAG_PREFIX}cache${TAG_SUFFIX}"
        latest_ref="${image_base}:${TAG_PREFIX}latest${TAG_SUFFIX}"
        buildcache_ref="${image_base}:${TAG_PREFIX}buildcache${TAG_SUFFIX}"

        # With mode=max, buildx writes an OCI cache index to cache_ref. Including
        # that same ref in --tag would overwrite it with the final image and
        # defeat intermediate-stage caching. Inline mode needs the tag so the
        # embedded cache metadata lands on a pullable image.
        if [ "${CACHE_MODE}" = "max" ]; then
          tags="${image_base}:${image_tag},${latest_ref}"
        else
          tags="${image_base}:${image_tag},${latest_ref},${cache_ref}"
        fi
        has_git_tag=false

        if [ "$INCLUDE_GIT_TAG" = "true" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
          git_tag="${TAG_PREFIX}${GITHUB_REF_NAME}${TAG_SUFFIX}"
          tags="${tags},${image_base}:${git_tag}"
          has_git_tag=true
        fi

        if [ -n "$EXTRA_TAGS" ]; then
          IFS=',' read -ra extra <<< "$EXTRA_TAGS"
          for raw in "${extra[@]}"; do
            tag="$(printf '%s' "$raw" | xargs)"
            if [ -n "$tag" ]; then
              tags="${tags},${image_base}:${TAG_PREFIX}${tag}${TAG_SUFFIX}"
            fi
          done
        fi

        echo "image_base=${image_base}" >> "$GITHUB_OUTPUT"
        echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
        echo "image_ref=${image_base}:${image_tag}" >> "$GITHUB_OUTPUT"
        echo "cache_ref=${cache_ref}" >> "$GITHUB_OUTPUT"
        echo "buildcache_ref=${buildcache_ref}" >> "$GITHUB_OUTPUT"
        echo "latest_ref=${latest_ref}" >> "$GITHUB_OUTPUT"
        echo "tags=${tags}" >> "$GITHUB_OUTPUT"
        echo "has_git_tag=${has_git_tag}" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Artifact Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: oauth2accesstoken
        password: ${{ inputs.access_token }}

    - name: Prepare build args
      id: build-args
      shell: bash
      env:
        APP_VERSION: ${{ inputs.app_version }}
        INPUT_ARGS: ${{ inputs.build_args }}
        SECRET_ARGS: ${{ inputs.build_secrets }}
      run: |
        set -euo pipefail

        args="APP_VERSION=${APP_VERSION}"

        if [ -n "$INPUT_ARGS" ]; then
          args="${args}"$'\n'"${INPUT_ARGS}"
        fi

        if [ -n "$SECRET_ARGS" ]; then
          args="${args}"$'\n'"${SECRET_ARGS}"
        fi

        eof="$(dd if=/dev/urandom bs=15 count=1 status=none | base64)"
        echo "args<<${eof}" >> "$GITHUB_OUTPUT"
        echo "${args}" >> "$GITHUB_OUTPUT"
        echo "${eof}" >> "$GITHUB_OUTPUT"

    - name: Resolve previous build cache image
      id: build-cache
      if: inputs.build_cache_stage != ''
      shell: bash
      env:
        BUILDCACHE_REF: ${{ steps.meta.outputs.buildcache_ref }}
        BUILD_CACHE_CONTEXT: ${{ inputs.build_cache_context }}
      run: |
        set -uo pipefail

        if [ -z "$BUILD_CACHE_CONTEXT" ]; then
          echo "::error::build_cache_stage requires build_cache_context"
          exit 1
        fi

        # A missing tag is the normal first-run state, not a failure. Omitting the
        # context leaves the Dockerfile's empty `FROM scratch` stage in place, so
        # the build just starts cold.
        if docker buildx imagetools inspect "$BUILDCACHE_REF" >/dev/null 2>&1; then
          echo "contexts=${BUILD_CACHE_CONTEXT}=docker-image://${BUILDCACHE_REF}" >> "$GITHUB_OUTPUT"
          echo "Seeding compiler cache from ${BUILDCACHE_REF}"
        else
          echo "contexts=" >> "$GITHUB_OUTPUT"
          echo "::notice::${BUILDCACHE_REF} not found - building with a cold compiler cache"
        fi

    # ---------------------------------------------------------------------
    # Pre-push vulnerability gate. Phase 1 of a two-phase build: identical
    # inputs to the push step below but exported to the local daemon instead of
    # the registry, so the scan can inspect the real image before it can be
    # pulled by anything. No `cache-to` here — inline cache is an image-exporter
    # feature and the push step below writes it.
    # ---------------------------------------------------------------------
    - name: Build image for scan (not pushed)
      if: inputs.scan_before_push == 'true'
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.context }}/${{ inputs.dockerfile }}
        target: ${{ inputs.build_target }}
        push: false
        load: true
        tags: ${{ steps.meta.outputs.image_ref }}
        build-args: ${{ steps.build-args.outputs.args }}
        build-contexts: ${{ steps.build-cache.outputs.contexts }}
        cache-from: |
          type=registry,ref=${{ steps.meta.outputs.cache_ref }}
          type=registry,ref=${{ steps.meta.outputs.latest_ref }}
        secrets: |
          GCP_ACCESS_TOKEN=${{ inputs.access_token }}
          ${{ inputs.docker_secrets }}
        provenance: false

    - name: Detect Trivy ignore file
      id: trivyignore
      if: inputs.scan_before_push == 'true'
      shell: bash
      env:
        TRIVYIGNORE_PATH: ${{ inputs.trivyignore_path }}
      run: |
        set -euo pipefail

        if [ -n "$TRIVYIGNORE_PATH" ]; then
          echo "path=${TRIVYIGNORE_PATH}" >> "$GITHUB_OUTPUT"
        elif [ -f "${GITHUB_WORKSPACE}/.trivyignore" ]; then
          echo "path=.trivyignore" >> "$GITHUB_OUTPUT"
        else
          echo "path=" >> "$GITHUB_OUTPUT"
        fi

    # JSON report first with exit-code 0, so the findings table renders even
    # when the blocking table scan below fails.
    - name: Scan built image (JSON report)
      if: inputs.scan_before_push == 'true'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: 'v0.71.0'
        scan-type: 'image'
        image-ref: ${{ steps.meta.outputs.image_ref }}
        scanners: ${{ inputs.scan_scanners }}
        severity: ${{ inputs.scan_severity }}
        format: 'json'
        output: ${{ runner.temp }}/trivy-image.json
        exit-code: '0'
        ignore-unfixed: ${{ inputs.scan_ignore_unfixed }}
        vuln-type: 'os,library'
        trivyignores: ${{ steps.trivyignore.outputs.path }}

    - name: Report pre-push findings
      if: always() && inputs.scan_before_push == 'true'
      uses: NeuralTrust/workflows/.github/actions/trivy-report@main
      with:
        report_path: ${{ runner.temp }}/trivy-image.json
        title: Trivy image scan (pre-push) — HIGH/CRITICAL
        subtitle: "Image: `${{ steps.meta.outputs.image_ref }}`"
        marker: trivy-image-prepush
        comment_on_pr: 'false'

    # The gate. continue-on-error so the enforce step below decides what a
    # finding means — blocking, or an accepted risk that still pushes.
    # SHA-pinned to the only post-incident-safe release, as in image-scan.yml.
    - name: Scan built image (table gate)
      id: scan_gate
      if: inputs.scan_before_push == 'true'
      continue-on-error: true
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: 'v0.71.0'
        scan-type: 'image'
        image-ref: ${{ steps.meta.outputs.image_ref }}
        scanners: ${{ inputs.scan_scanners }}
        severity: ${{ inputs.scan_severity }}
        format: 'table'
        exit-code: '1'
        ignore-unfixed: ${{ inputs.scan_ignore_unfixed }}
        vuln-type: 'os,library'
        trivyignores: ${{ steps.trivyignore.outputs.path }}

    - name: Enforce pre-push scan gate
      id: scan_enforce
      if: inputs.scan_before_push == 'true'
      shell: bash
      env:
        GATE_OUTCOME: ${{ steps.scan_gate.outcome }}
        ACCEPT_RISK: ${{ inputs.accept_vulnerability_risk }}
        IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        SCAN_SEVERITY: ${{ inputs.scan_severity }}
      run: |
        set -euo pipefail

        # Outputs are written before any exit so a blocked build still reports
        # why. They are best-effort on the blocking path: the composite aborts
        # here, so a caller may see the job fail without reading scan_blocked.
        # The ::error:: annotation below is what always states the cause.
        emit() {
          echo "result=$1" >> "$GITHUB_OUTPUT"
          echo "blocked=$2" >> "$GITHUB_OUTPUT"
        }

        if [ "$GATE_OUTCOME" = "success" ]; then
          emit passed ""
          echo "No fixable ${SCAN_SEVERITY} vulnerabilities - pushing ${IMAGE_REF}"
          exit 0
        fi

        if [ "$ACCEPT_RISK" = "true" ]; then
          emit accepted-risk ""
          echo "::warning title=Vulnerability risk accepted::Fixable ${SCAN_SEVERITY} vulnerabilities are present in ${IMAGE_REF} and the push is proceeding because accept_vulnerability_risk is set. Record each accepted CVE in .trivyignore with a revisit date."
          exit 0
        fi

        emit blocked "true"
        echo "::error title=Image scan blocked the push::${IMAGE_REF} has fixable ${SCAN_SEVERITY} vulnerabilities. Nothing was pushed to the registry."
        {
          echo "## Push blocked by image scan"
          echo
          echo "\`${IMAGE_REF}\` has fixable **${SCAN_SEVERITY}** vulnerabilities."
          echo
          echo "The image was **not** pushed and no deployment was updated."
          echo
          echo "Fix the findings listed above, or set \`accept_vulnerability_risk: true\`"
          echo "on the calling workflow to push anyway and record the decision."
        } >> "$GITHUB_STEP_SUMMARY"
        exit 1

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.context }}/${{ inputs.dockerfile }}
        target: ${{ inputs.build_target }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        build-args: ${{ steps.build-args.outputs.args }}
        build-contexts: ${{ steps.build-cache.outputs.contexts }}
        cache-from: |
          type=registry,ref=${{ steps.meta.outputs.cache_ref }}
          type=registry,ref=${{ steps.meta.outputs.latest_ref }}
        secrets: |
          GCP_ACCESS_TOKEN=${{ inputs.access_token }}
          ${{ inputs.docker_secrets }}
        cache-to: ${{ inputs.cache_mode == 'max' && format('type=registry,ref={0},mode=max', steps.meta.outputs.cache_ref) || 'type=inline' }}
        provenance: false

    # Same builder, same build-args and contexts as the step above, so every
    # layer is already a local cache hit and this only compresses and pushes the
    # one cache blob. A failure here costs the next run a warm cache, nothing
    # more, so it must never fail the deploy.
    - name: Push build cache image
      if: inputs.build_cache_stage != ''
      continue-on-error: true
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.context }}/${{ inputs.dockerfile }}
        target: ${{ inputs.build_cache_stage }}
        push: true
        tags: ${{ steps.meta.outputs.buildcache_ref }}
        build-args: ${{ steps.build-args.outputs.args }}
        build-contexts: ${{ steps.build-cache.outputs.contexts }}
        cache-from: type=registry,ref=${{ steps.meta.outputs.cache_ref }}
        secrets: |
          GCP_ACCESS_TOKEN=${{ inputs.access_token }}
          ${{ inputs.docker_secrets }}
        provenance: false
